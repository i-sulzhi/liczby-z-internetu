.pa-dot.pa-czasem { border-color: var(--accent); background: var(--accent-mid); }
.pa-dot.pa-duzo { border-color: var(--err); background: var(--err); }
.pa-dot.pa-widzi { border-color: var(--accent); background: var(--accent); }
.pa-dot.pa-nie { border-style: dashed; }
.pa-rows { display: grid; gap: 4px; max-width: 420px; }
.pa-row { display: grid; grid-template-columns: 1fr 80px 80px; gap: 8px; font-size: 13px; align-items: center; }
.pa-head { font: 700 10px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); }
.pa-val { font-family: var(--mono); }
.pa-key::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 2px solid var(--line-strong); }
.pa-key.pa-czasem::before { border-color: var(--accent); background: var(--accent-mid); }
.pa-key.pa-duzo::before { border-color: var(--err); background: var(--err); }
.pa-key.pa-widzi::before { border-color: var(--accent); background: var(--accent); }
.pa-key.pa-nie::before { border-style: dashed; }
.pa-ask { font: 600 13px var(--sans); color: var(--ink-soft); }
.pa-tabs { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.pa-dots { margin: 4px 0; }

/* figure: three uses of traces (Salganik) */
.us-card { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-panel); }
.us-what { font: 600 15px/1.45 var(--sans); }
.us-ex { display: grid; grid-template-columns: 80px 1fr; gap: 8px; font-size: 13px; line-height: 1.45; }
.us-label { font: 700 10px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); padding-top: 2px; }
.us-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.us-today { font: 600 13px var(--sans); }
.us-gap { fill: var(--warn-bg); }

/* figure: decision tree for using a post */

/* figure: data that vanish */

.dc-leg-kept::before { background: var(--accent); }
@media (max-width: 600px) { .dc-row { grid-template-columns: 40px 1fr 124px; font-size: 11px; } }

/* exercise: an agent's trace */
.ag { display: grid; gap: 12px; }
.ag-question { padding: 10px 12px; border-radius: 10px; background: var(--bg-sunken); font: 600 14px/1.45 var(--sans); }
.ag-label { display: block; font: 700 10px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); margin-bottom: 2px; }
.ag-steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; border-left: 2px solid var(--line-strong); padding-left: 12px; }
.ag-step { display: grid; gap: 3px; }
.ag-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.ag-n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--bg-panel); font: 700 11px var(--mono); }

.ag-input { font: 12px var(--mono); color: var(--ink-soft); overflow-wrap: anywhere; min-width: 0; }
.ag-result { font-size: 13px; line-height: 1.45; }
.ag-task { font: 600 14px/1.45 var(--sans); }
.ag-claims { margin: 0; padding-left: 22px; display: grid; gap: 12px; }
.ag-text { margin: 0 0 6px; font-style: italic; }

.ag-why { margin: 6px 0 0; font-size: 14px; padding: 6px 10px; border-radius: 8px; }
.ag-right .ag-why { background: var(--ok-bg); }

.ag-meta { font-size: 12px; color: var(--ink-faint); }

/* figure: is it anonymous? */
.an { display: grid; gap: 12px; }
.an-say { margin: 0; }
.an-bins { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

.an-rows { display: grid; gap: 8px; }
.an-row { display: grid; grid-template-columns: 210px 1fr 56px; gap: 10px; align-items: center; font-size: 13px; }

.an-fill { height: 100%; border-radius: 5px; min-width: 0; }

.an-small { background: var(--warn); }
.an-safe { background: var(--ok); }
.an-val { font-family: var(--mono); text-align: right; }
.an-example { padding: 10px 12px; border-radius: var(--radius); background: var(--bg-sunken); font-size: 14px; }

/* chapter 2 figures: search data (figures/search.js) */

.sq-card { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 6px 14px; margin: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; line-height: 1.45; }
.sq-card dt { color: var(--ink-soft); }
.sq-card dd { margin: 0; }
.sq-card .sq-hidden { color: var(--warn); font-weight: 600; }
.sq-wrap { width: 100%; }
.sq-svg { width: 100%; height: auto; display: block; }
.sq-grid { stroke: var(--line); stroke-width: 1; }
.sq-tick, .sq-mark-label { font: 10px var(--mono); fill: var(--ink-faint); }
.sq-mark-label { font-weight: 700; fill: var(--ink); font-size: 12px; }
.sq-bar { fill: var(--accent-mid); }
.sq-bar-peak { fill: var(--accent); }
.sq-bar-watch { fill: var(--warn); }
.sq-line { fill: none; stroke: var(--accent); stroke-width: 2; }
.sq-line2 { fill: none; stroke: var(--warn); stroke-width: 2; }
.sq-line3 { fill: none; stroke: var(--ink-soft); stroke-width: 2; stroke-dasharray: 5 3; }

.sq-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; }
.sq-leg::before { content: ""; display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: 3px; border-radius: 2px; }
.sq-leg-a::before { background: var(--accent); }
.sq-leg-b::before { background: var(--warn); }
.sq-leg-c::before { background: var(--ink-soft); }
.sq-sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
.sq-notes { margin: 0; padding-left: 18px; }
.sq-mark { fill: var(--warn); stroke: var(--bg, #fff); stroke-width: 1.5; }
.sq-read { padding: 8px 10px; border-radius: 8px; background: var(--bg-sunken); font-size: 14px; line-height: 1.45; }
.sq-code .fg-toggle { font-family: var(--mono); font-size: 13px; }
.sq-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.sq-table th, .sq-table td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.sq-table .sq-num { text-align: right; font-variant-numeric: tabular-nums; }
.sq-hit td { background: var(--accent-soft); }
.sq-bars { display: flex; flex-direction: column; gap: 4px; }
.sq-row { display: grid; grid-template-columns: 80px 1fr 52px; gap: 8px; align-items: center; font-size: 13px; }
.sq-row-anchor .sq-name { font-weight: 700; }
.sq-track { height: 12px; background: var(--bg-sunken); border-radius: 3px; overflow: hidden; }
.sq-fill { display: block; height: 100%; background: var(--accent); }
.sq-row-anchor .sq-fill { background: var(--warn); }
.sq-row .sq-num { text-align: right; font-variant-numeric: tabular-nums; }

@media (max-width: 600px) {
  .sq-tick { font-size: 20px; }

  .sq-card { grid-template-columns: 1fr; }

}

/* chapter 2, more figures (figures/search2.js) */
.sq-tall { max-height: 220px; }
.sq-dot { fill: var(--accent); }
.sq-read-warn { background: var(--warn-bg); }
.sq-steps { margin: 0; padding-left: 22px; font-size: 14px; line-height: 1.5; }
.sq-steps li { margin: 4px 0; }
.sq-units { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; max-width: 420px; }
.sq-unit { aspect-ratio: 1; border-radius: 2px; background: var(--bg-sunken); border: 1px solid var(--line); }
.sq-unit-on { background: var(--accent); border-color: var(--accent); }
.sq-url { font: 13px var(--mono); line-height: 1.9; word-break: break-all; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.sq-url-base { color: var(--ink-faint); }
.sq-url-part { font: inherit; padding: 1px 3px; margin: 0 1px; border: 1px dashed var(--line-strong); border-radius: 4px; background: none; color: var(--ink); cursor: pointer; word-break: break-all; text-align: left; }
.sq-url-on { background: var(--accent-soft); border-style: solid; border-color: var(--accent); }
.sq-url-missing { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
.sq-url-field { margin-top: 6px; font-weight: 600; }
@media (max-width: 600px) { .sq-units { gap: 2px; } }
/* 2.6 the path from queries to a conclusion: four checks, a card per check, lines that move */
.sq-path { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sq-path li { display: flex; align-items: center; gap: 6px; }
.sq-path li + li::before { content: "→"; color: var(--ink-faint); }
.sq-path-start { font-size: 13px; color: var(--ink-soft); }
.sq-gate { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
.sq-gate-num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--bg-sunken); font-weight: 700; font-size: 12px; }
.sq-gate-on { border-color: var(--accent); background: var(--accent-soft); }
.sq-gate-on .sq-gate-num { background: var(--accent); color: var(--bg, #fff); }
.sq-gate-done .sq-gate-num { background: var(--ok-bg); color: var(--ok); }
.sq-path-card { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; animation: sq-card-in 0.35s ease; }
.sq-path-q { font-weight: 700; font-size: 16px; }
.sq-path-text { margin: 0; font-size: 14px; line-height: 1.5; }
.sq-path-svg { max-height: 220px; }
.sq-path-card > .fg-toggle { align-self: flex-start; }
.sq-draw-in { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sq-draw 1.4s ease 0.3s forwards; }
.sq-fade-out { animation: sq-fade 0.6s ease 0.4s forwards; }
@keyframes sq-draw { to { stroke-dashoffset: 0; } }
@keyframes sq-fade { to { opacity: 0; } }
@keyframes sq-card-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .sq-draw-in { animation: none; stroke-dashoffset: 0; }
  .sq-fade-out { animation: none; opacity: 0; }
  .sq-path-card { animation: none; }
}
/* reading a chart point by point (probe in figures/common.js) */
.sq-probe-wrap svg { cursor: crosshair; touch-action: pan-y; }
.sq-probe-wrap svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sq-probe-wrap svg:focus:not(:focus-visible) { outline: none; }
.sq-probe-hit { fill: transparent; pointer-events: all; }
.sq-probe-line { stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
.sq-probe-dot { fill: var(--bg, #fff); stroke-width: 2; pointer-events: none; }
.sq-probe-dot.sq-leg-a { stroke: var(--accent); }
.sq-probe-dot.sq-leg-b { stroke: var(--warn); }
.sq-probe-dot.sq-leg-c { stroke: var(--ink-soft); }
.sq-probe { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; min-height: 1.5em; margin-top: 4px; font-size: 13px; color: var(--ink-soft); }
.sq-probe > b { color: var(--ink); }
.sq-probe-item b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* unnumbered schemes in the text (schemes.js): steps, cards with mini charts, tables */
.bk-steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 26px; align-items: stretch; min-width: 0; }
.bk-step { flex: 1; position: relative; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-panel); font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; gap: 2px; }
.bk-step + .bk-step::before { content: "→"; position: absolute; left: -20px; top: 50%; transform: translateY(-50%); color: var(--accent); font-weight: 700; }
.bk-step-n { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 13px/22px var(--sans); text-align: center; }
.bk-step-title { font-size: 15px; }
.bk-step-text { color: var(--ink-soft); }
/* min-width 0 and min(): an auto-fit grid would otherwise make the text column as wide as four cards */
.bk-cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: 10px; min-width: 0; }
.bk-card { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-panel); font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; gap: 2px; }
.bk-card-link { color: inherit; text-decoration: none; display: flex; flex-direction: column; gap: 2px; }
.bk-card:has(.bk-card-link:hover), .bk-card:has(.bk-card-link:focus-visible) { border-color: var(--accent); }
.bk-card-text { color: var(--ink-soft); }
.bk-glyph { width: 64px; height: 24px; margin-bottom: 4px; }
.bk-glyph polyline { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.bk-glyph-a { stroke: var(--accent); }
.bk-glyph-b { stroke: var(--warn); }
.bk-table-wrap { overflow-x: auto; min-width: 0; }
.bk-table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.45; }
.bk-table th, .bk-table td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.bk-table th { color: var(--ink-soft); font-weight: 600; background: var(--bg-sunken); }
@media (max-width: 600px) {
  .bk-steps { flex-direction: column; gap: 22px; }
  .bk-step + .bk-step::before { content: "↓"; left: 50%; top: -19px; transform: translateX(-50%); }
}

/* ---- chapter 3: spreadsheet exercises (figures/sheet.js) */
.sh { display: grid; gap: 12px; min-width: 0; }

.sh-file-btn { justify-self: start; max-width: 100%; padding: 4px 12px; border: 1px solid var(--line-strong); border-radius: 14px; background: transparent; color: var(--ink); font: 13px var(--mono); cursor: pointer; overflow-wrap: anywhere; text-align: left; }

/* ---- chapter 4, part A: rules for AGENTS.md (figures/brief.js) */

/* ---- chapter 4, mechanism figures (figures/mechanics.js) */
@keyframes mc-pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes mc-blink { 50% { opacity: .15; } }
.mc-pop { animation: mc-pop .35s ease-out; }

.mc-pages { display: grid; gap: 8px; min-width: 0; }

.mc-vid.mc-again { background: var(--warn-bg); outline: 1px solid var(--warn); }
.mc-token { font: 12px var(--mono); color: var(--accent); overflow-wrap: anywhere; }
.mc-counters { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 13px var(--mono); }
.mc-tree { display: grid; gap: 6px; }
.mc-top { padding: 4px 8px; border-radius: var(--radius); background: var(--bg-sunken); font-size: 13px; }
.mc-replies { display: grid; gap: 3px; margin: 3px 0 0 18px; overflow: hidden; max-height: 12em; transition: max-height .45s ease, opacity .45s ease; }

  const cut = short.dates.map((d) => num(long.values[0][long.dates.indexOf(d)]));
  const peak = Math.max(...cut);
  const rescaled = cut.map((v) => Math.round((100 * v) / peak));
  const own = short.values[0].map(num);
  const longPeak = long.dates[long.values[0].indexOf(100)];
  return { peak, longPeak, rescaled, own, maxDiff: Math.max(...rescaled.map((v, i) => Math.abs(v - own[i]))) };
}

/** Yearly means on the scale of the big chart; the small chart is joined through zalando. */
function shopMeans() {
  const big = S.big; const small = S.small;
  const sum = (xs) => xs.reduce((a, x) => a + num(x), 0);
  const factor = sum(big.values[big.items.indexOf('zalando')]) / sum(small.values[small.items.indexOf('zalando')]);
  const rows = [
    ...big.items.map((name, k) => ({ name, chart: 1, value: mean(big.values[k]) })),
    ...small.items.filter((name) => name !== 'zalando').map((name) => ({ name, chart: 2, value: mean(small.values[small.items.indexOf(name)]) * factor })),
  ];
  const pair = S.pair;
  const allegroBig = rows.find((r) => r.name === 'allegro').value;
  const answearJoined = rows.find((r) => r.name === 'answear').value;
  return {
    factor, rows,
    joinedRatio: allegroBig / answearJoined,
    pairRatio: mean(pair.values[0]) / mean(pair.values[1]),
    pairFlat: pair.values[1].every((v) => v === pair.values[1][0]),
  };
}

// ---------------------------------------------------------------- 2.6 validation

function pearson(a, b) {
  const ma = a.reduce((s, x) => s + x, 0) / a.length; const mb = b.reduce((s, x) => s + x, 0) / b.length;
  let sab = 0; let saa = 0; let sbb = 0;
  for (let i = 0; i < a.length; i++) { sab += (a[i] - ma) * (b[i] - mb); saa += (a[i] - ma) ** 2; sbb += (b[i] - mb) ** 2; }
  return sab / Math.sqrt(saa * sbb);
}

/**
 * Two unemployment rates to check search against. "reg" is the GUS registered rate, the one that
 * counts people at labour offices (and the one Malinowski used); "lfs" is Eurostat's rate from the
 * labour force survey (BAEL). The registered rate changed its base in December 2020 (GUS gives both
 * variants until December 2021), so a year-on-year change is always taken on one base.
 */
const BENCH = { reg: TRENDS.reg, lfs: TRENDS.une };
const BENCHES = ['reg', 'lfs'];

/** One search series against unemployment, month by month, raw or as change against 12 months earlier. */
function validationPair(item, mode, bench = 'reg') {
  const p = S.praca; const u = BENCH[bench];
  const k = p.items.indexOf(item);
  const months = p.dates.filter((m) => u.months.includes(m));
  const tr = (m) => num(p.values[k][p.dates.indexOf(m)]);
  const un = (m) => u.values[u.months.indexOf(m)];
  const back = (m) => `${Number(m.slice(0, 4)) - 1}${m.slice(4)}`;
  const oldBase = (m) => u.old?.[m] ?? un(m);
  const change = (m) => (u.baseFrom && back(m) < u.baseFrom ? oldBase(m) - oldBase(back(m)) : un(m) - un(back(m)));
  const use = mode === 'raw' ? months : months.filter((m) => u.months.includes(back(m)) && p.dates.includes(back(m)));
  const a = use.map((m) => (mode === 'raw' ? tr(m) : tr(m) - tr(back(m))));
  const b = use.map((m) => (mode === 'raw' ? un(m) : change(m)));
  return { months: use, a, b, r: pearson(a, b) };
}

// ---------------------------------------------------------------- 2.1 the puzzle that opens the chapter

/**
 * "urząd pracy" and unemployment, raw, without r: the chapter asks whether search knows
 * unemployment and answers in 2.6. The readout compares the searches' peak year with the last
 * full year of both series.
 */
function puzzleNumbers() {
  const p = S.praca; const u = TRENDS.reg; const k = p.items.indexOf('urząd pracy');
  const yearMean = (dates, values, y) => { const xs = dates.map((d, i) => [d, values[i]]).filter(([d]) => d.startsWith(y)).map(([, v]) => num(v)); return xs.length === 12 ? mean(xs) : null; };
  const years = [...new Set(p.dates.map((d) => d.slice(0, 4)))];
  const search = years.map((y) => [y, yearMean(p.dates, p.values[k], y)]).filter(([, v]) => v != null);
  const peak = search.reduce((a, b) => (b[1] > a[1] ? b : a));
  const last = search.filter(([y]) => yearMean(u.months, u.values, y) != null).at(-1);
  return { y1: peak[0], a: Math.round(peak[1]), y2: last[0], b: Math.round(last[1]), c: one(yearMean(u.months, u.values, peak[0])), d: one(yearMean(u.months, u.values, last[0])) };
}

/** Weeks of 2025 from the first week at 10 or more up to the Black Friday peak (the 100), and the peak week. */
function bfRamp() {
  const s = S.bf2025;
  const v = s.values[0].map(num);
  const peak = v.indexOf(100);
  let start = peak;
  while (start > 0 && v[start - 1] >= 10) start--;
  return { weeks: peak - start, startDay: s.dates[start], peakDay: s.dates[peak] };
}

function pathDredge(d) {
  const W = 640; const H = chartH(150); const L = 8; const R = 8; const T = 8; const B = 8;
  const all = [...d.target, ...d.series]; const lo = Math.min(...all); const hi = Math.max(...all);
  const x = (i) => L + (i / (d.target.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - (v - lo) / (hi - lo || 1)) * (H - T - B);
  const pts = (vs) => vs.map((v, i) => [x(i), y(v)]);
  const chart = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'sq-svg sq-path-svg', role: 'img', 'aria-label': t('bk.s2.path.ariaDredge') },
    svg('line', { x1: x(DREDGE.fit), x2: x(DREDGE.fit), y1: T, y2: H - B, class: 'sq-note' }),
    svg('polyline', { points: pointsText(pts(d.target)), class: 'sq-line' }),
    svg('polyline', { points: pointsText(pts(d.series)), class: 'sq-line2 sq-draw-in', pathLength: 1 }));
  return probe(chart, {
    W, top: T, bottom: H - B, n: d.target.length, x,
    read: (i) => ({
      head: t('bk.probe.month', { i: i + 1, n: d.target.length }),
      rows: [['sq-leg-a', t('bk.s2.dr.target'), one(d.target[i])], ['sq-leg-b', t('bk.s2.dr.best'), one(d.series[i])]],
      ys: [['sq-leg-a', y(d.target[i])], ['sq-leg-b', y(d.series[i])]],

/** What an exercise puts into the report as its answer, by id: () => text or null. Lessons give their accepted code. */
const ANSWERS = {};
/** The other way round: an answer from a report put back, by id: (text) => void. */
const RESTORE = {};

/**
 * What a student's own report brings to this chapter, on another computer. Items are matched by
 * their label, not their number, and the card by its title. Nothing done here is undone: a
 * finished exercise stays as it is, and a filled card field keeps its text.
 *
 * @param {Object} chapter
 * @param {Object} report  readReport() of a checked report
 * @returns {{done: number, worked: number, total: number, unknown: number, card: boolean, apply: Function}}
 *   `apply()` writes it for the person chosen at that moment
 */
function reportPlan(chapter, report) {
  const norm = (s) => String(s).replace(/\s+/g, ' ').trim();
  const byLabel = new Map(chapter.summary.map((it) => [norm(it.label), it]));
  const pairs = [];
  let unknown = 0;
  for (const line of report.items || []) {
    if (!line.status) continue;
    const it = byLabel.get(norm(line.label));
    if (it) pairs.push([it, line]); else unknown += 1;
  }
  const cardKey = chapter.card === false ? null : chapter.card || 'karta';
  const cardText = cardKey && CARDS[cardKey] && (report.sections || []).find((x) => norm(x.title) === norm(CARDS[cardKey].title()))?.text;
  const extraText = chapter.reportExtra && (report.sections || []).find((x) => norm(x.title) === norm(chapter.reportExtra.title))?.text;
  const apply = () => {
    for (const [it, line] of pairs) {
      if (it.lesson) {
        const p = getProgress(it.lesson);
        if (p?.status === 'done') continue;
        setProgress(it.lesson, line.status === 'done'
          ? { status: 'done', doneAt: line.doneAt || Date.now(), attempts: line.attempts, hintsUsed: line.hintsUsed, solvedCode: line.answer, lastCode: line.answer }
          : { status: 'seen', attempts: line.attempts, hintsUsed: line.hintsUsed });
        continue;
      }
      if (line.status !== 'done' || isDone(it.id)) continue;
      if (line.answer) RESTORE[it.id]?.(line.answer);
      setItem(`done:${it.id}`, line.doneAt || Date.now());
    }
    if (extraText != null && chapter.reportExtra.restore && !String(chapter.reportExtra.text() || '').trim()) chapter.reportExtra.restore(extraText);
    if (cardText) {
      const have = getItem(cardKey) || {};
      const empty = (v) => v == null || (Array.isArray(v) ? !v.length : !String(v).trim());
      const back = cardFromText(cardKey, cardText);
      setItem(cardKey, { ...back, ...Object.fromEntries(Object.entries(have).filter(([, v]) => !empty(v))) });
    }
  };
  return {
    done: pairs.filter(([, l]) => l.status === 'done').length,
    worked: pairs.length,
    total: chapter.summary.length,
    unknown,
    card: !!cardText && Object.keys(cardFromText(cardKey, cardText)).length > 0,
    apply,
  };
}

const fieldsOf = (def) => def.fields || [];

/** Verdict for a saved state: the choice first, then the numbers. */
function checkBrief(def, state) {

  const opt = def.options[state.choice];
  if (!opt?.right) return { ok: false, wrong: [], text: `${def.nope || 'To nie ta reguła.'} ${opt?.why || ''}`.trim() };
  if (!fieldsOf(def).length) return { ok: true, wrong: [], text: def.success };
  const v = checkSheet({ fields: def.fields, wrong: def.wrong, success: def.success }, state);
  return v.ok ? { ...v, text: def.success } : v;
}

    const opts = def.options.map((o, i) => el('button', {
      type: 'button', class: 'br-opt', 'aria-pressed': 'false',
      onClick: () => { state.choice = i; save(); mark(); mount(verdict); verdict.className = 'sh-verdict'; },
    }, el('span.br-letter', LETTERS[i]), el('span.br-text', { html: rich(o.text) })));
    const mark = () => opts.forEach((b, i) => { b.classList.toggle('br-on', state.choice === i); b.setAttribute('aria-pressed', String(state.choice === i)); });
    const inputs = new Map();
    const fields = fieldsOf(def).map((f) => {
      const input = el('input.sh-input', { type: 'text', inputmode: 'decimal', id: `br-${def.id}-${f.id}`, autocomplete: 'off', spellcheck: 'false' });
      input.value = state[f.id] || '';
      input.addEventListener('input', () => { state[f.id] = input.value; input.classList.remove('sh-bad'); save(); });
      inputs.set(f.id, input);
      return el('div.sh-field', el('label', { for: input.id, html: rich(f.label) }), input);
    });
    const check = () => {
      const v = checkBrief(def, state);
      for (const [id, input] of inputs) input.classList.toggle('sh-bad', v.wrong.includes(id));
      if (v.ok) {
        say('sh-right', `${v.text} Reguła trafia do twojego AGENTS.md.`);
        if (!isDone(def.id)) markDone(def.id);
        save();
        onDone?.(def.id);
      } else say('sh-wrong', v.text || 'Jeszcze nie.');
    };
    mark();
    const host = el('div.sh.br',
      el('p.sh-say', { html: rich(def.situation) }),
      def.code ? el('pre.sh-pre', def.code) : null,
      fields.length ? el('div.sh-fields', fields) : null,
      el('div.sh-files-label', def.question),
      el('div.br-opts', opts),
      el('div.sh-bar', el('button.ls-check', { type: 'button', onClick: check }, 'Sprawdź')),
      verdict);
    if (isDone(def.id) && checkBrief(def, state).ok) say('sh-right', `${def.success} Reguła trafia do twojego AGENTS.md.`);
    return host;
  };

function pipeFigure({ num: n = 'Rysunek' } = {}) {
  const P = E.pipe;
  const st = { v: 'v1', shown: STAGES.length, pick: 0, fresh: -1 };
  const host = el('div');
  let timer = null;
  const pct = (k, v) => Math.max(P[v][k] ? 1.5 : 0, (100 * P[v][k]) / P.v2[k]);
  const draw = () => {
    const s = STAGES[st.pick];

      toggles([['v1', 'Wersja 1, krótki opis celu'], ['v2', 'Wersja 2, zlecenie z regułami']], st.v, (v) => { st.v = v; play(); }),
      el('div.pp-flow', STAGES.map((g, i) => el('button', {
        type: 'button', class: ['pp-row', i === st.pick ? 'pp-on' : '', i < st.shown ? '' : 'pp-wait', i === st.fresh ? 'pp-new' : ''].filter(Boolean).join(' '),
        'aria-pressed': String(i === st.pick), onClick: () => { st.pick = i; st.fresh = -1; draw(); },
      }, el('span.pp-name', g.name),
      el('span.pp-track', el('span.pp-fill', { style: `width:${i < st.shown ? pct(g.key, st.v).toFixed(1) : 0}%` })),
      el('span.pp-num', i < st.shown ? fmtNum(P[st.v][g.key]) : ''),

      el('div.sq-read', `${s.name[0].toUpperCase()}${s.name.slice(1)}. ${s.why[st.v]} Wersja 1 ma ${fmtNum(P.v1[s.key])}, wersja 2 ma ${fmtNum(P.v2[s.key])}.`),

  const play = () => {
    clearTimeout(timer);
    if (reduced()) { st.shown = STAGES.length; st.fresh = -1; draw(); return; }
    st.shown = 0; st.fresh = -1; draw();
    const next = () => {
      st.shown += 1; st.pick = st.shown - 1; st.fresh = st.pick; draw();
      if (st.shown < STAGES.length) timer = setTimeout(next, 650);
    };
    timer = setTimeout(next, 250);
  };
  draw();

    el('div.fg-caption', 'Test „manosfera”, kwiecień 2026 r. Wersja 2 to wynik testu. Wersja 1 to ten sam test policzony według jej zasad. Długość paska to część wyniku wersji 2.'));

  const N = cum.length;

  const chart = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'sq-svg', role: 'img', 'aria-label': 'Narastający udział wyświetleń, filmy od najczęściej oglądanych' },

      svg('text', { x: L + 2, y: y(v) - 4, class: 'sq-tick', 'text-anchor': 'start' }, `${v}%`)]),
    svg('line', { x1: x(E.s5.half - 1), x2: x(E.s5.half - 1), y1: T, y2: H - B, class: 'sq-note' }),
    svg('polyline', { points: cum.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' '), class: 'sq-line' }),

  const read = probe(chart, {

// ---------------------------------------------------------------- ytjoin: how a lookup by id joins tables

const FILMS = [['film_a', 'pl', 350], ['film_b', 'en', 1200], ['film_c', '', 90], ['film_d', 'en', 2600], ['film_e', 'pl', 45]];
// the status sheet in its own order; film_d has no row
const STAT = [['film_e', 0, 'zero'], ['film_a', 4, 'ok'], ['film_c', 1, 'ok'], ['film_b', 15, 'ok']];
const HITS = ['film_a', 'film_b', 'film_c', 'film_a', 'film_d', 'film_e'];
/** The invented numbers of the picture (test/book4.mjs: none is an answer of the chapter). */
const JOIN_NUMBERS = {
  views: FILMS.reduce((a, r) => a + r[2], 0),
  viewsByHits: HITS.reduce((a, h) => a + FILMS.find((r) => r[0] === h)[2], 0),
  collected: STAT.reduce((a, r) => a + r[1], 0),
};

const MODES = {
  exact: { label: '=X.WYSZUKAJ(…;"brak")', say: 'Formuła szuka id w drugiej tabeli, w dowolnej kolejności, i przynosi wartość z tego samego wiersza. Film bez pary dostaje „brak” i widać go od razu.' },
  near: { label: 'WYSZUKAJ.PIONOWO bez FAŁSZ', say: 'Bez FAŁSZ Excel szuka w posortowanej tabeli najbliższego id, które nie jest większe. Film bez pary dostaje cudzą wartość i błędu nie widać.' },
  hits: { label: 'od trafień', say: 'Tu zaczynamy od trafień, a film_a jest w nich dwa razy. Formuła działa dobrze, ale film_a ma teraz dwa wiersze i jego wyświetlenia liczą się podwójnie.' },
};

function joinFigure({ num: n = 'Rysunek' } = {}) {
  const st = { mode: 'exact', at: 0 };
  const host = el('div.dp-host');
  const sorted = [...STAT].sort((a, b) => a[0].localeCompare(b[0]));
  const draw = () => {
    const right = st.mode === 'near' ? sorted : STAT;
    const left = st.mode === 'hits' ? HITS.map((h) => FILMS.find((r) => r[0] === h)) : FILMS;
    const look = (id) => {
      const exact = right.find((r) => r[0] === id);
      if (exact || st.mode !== 'near') return { row: exact || null, wrong: false };
      const prev = right.filter((r) => r[0] < id).at(-1);
      return { row: prev || null, wrong: true };
    };
    const cur = left[st.at - 1];
    const curHit = cur ? look(cur[0]) : null;
    const done = st.at >= left.length;
    const row = Math.max(2, st.at + 1); // the sheet row of the film being looked up (row 1 is the header)
    const leftRows = left.map((r, i) => {
      const filled = i < st.at;
      const res = filled ? look(r[0]) : null;
      const cell = !filled ? '' : res.row ? String(res.row[1]) : 'brak';
      const cls = !filled ? '' : !res.row ? 'sa-bad' : res.wrong ? 'sa-bad dp-fake' : (i === st.at - 1 ? 'sa-new' : '');
      const dup = st.mode === 'hits' && left.findIndex((x) => x[0] === r[0]) !== i;
      return el('tr', { class: [i === st.at - 1 ? 'dp-row-on' : '', dup && filled ? 'dp-row-dup' : ''].filter(Boolean).join(' ') || null },
        el('td', { class: 'dp-hot' }, r[0]), el('td', r[1] || '·'), el('td', fmtNum(r[2])),
        el('td', { class: cls || null }, cell));
    });
    const rightRows = right.map((r) => el('tr', { class: curHit?.row === r ? (curHit.wrong ? 'dp-row-bad' : 'dp-row-on') : null },
      el('td', { class: 'dp-hot' }, r[0]), el('td', String(r[1])), el('td', r[2])));
    const sum = left.reduce((a, r) => a + r[2], 0);
    const lonely = left.filter((r) => !right.some((x) => x[0] === r[0])).length;
    let read = MODES[st.mode].say;
    if (done && st.mode === 'exact') read += ` Bez pary: ${lonely} film. Wierszy tyle, ile filmów.`;
    if (done && st.mode === 'near') read += ' film_d dostał wartość film_c, choć skrypt nic pod nim nie zebrał.';
    if (done && st.mode === 'hits') read += ` Suma wyświetleń po trafieniach to ${fmtNum(sum)}, a w tabeli filmów ${fmtNum(JOIN_NUMBERS.views)}.`;
    mount(host,
      toggles(Object.entries(MODES).map(([k, m]) => [k, m.label]), st.mode, (v) => { st.mode = v; st.at = 0; draw(); }),
      el('div.dp-join',
        el('div.dp-side', el('div.sh-files-label', st.mode === 'hits' ? 'trafienia + filmy' : 'filmy'),
          el('div.dp-wrap', el('table.dp-grid', el('thead', el('tr', ['film', 'jezyk', 'wyswietlenia', 'zebrane'].map((h, i) => el('th', { class: i === 3 ? 'dp-new' : null }, h)))), el('tbody', leftRows)))),
        el('div.dp-arrow', { 'aria-hidden': 'true' }, cur ? (curHit.row ? (curHit.wrong ? '≈' : '=') : '?') : '⇄'),
        el('div.dp-side', el('div.sh-files-label', st.mode === 'near' ? 'status (posortowany)' : 'status'),
          el('div.dp-wrap', el('table.dp-grid', el('thead', el('tr', ['film', 'zebrane', 'status'].map((h) => el('th', h)))), el('tbody', rightRows))))),
      el('div.sa-bar', el('span.sa-fx', 'fx'), el('code', st.mode === 'near' ? `=WYSZUKAJ.PIONOWO(A${row};status!A:C;2)` : `=X.WYSZUKAJ(A${row};status!A:A;status!B:B;"brak")`)),
      el('div.dp-play',
        el('button.ghost-btn', { type: 'button', disabled: done ? true : null, onClick: () => { st.at = Math.min(left.length, st.at + 1); draw(); } }, cur ? 'Następny wiersz ▸' : 'Szukaj pary ▸'),
        el('button.ghost-btn', { type: 'button', disabled: done ? true : null, onClick: () => { st.at = left.length; draw(); } }, 'Wszystkie'),
        el('button.ghost-btn', { type: 'button', disabled: st.at ? null : true, onClick: () => { st.at = 0; draw(); } }, 'Od nowa')),
      el('div.sq-read', { 'aria-live': 'polite' }, cur && !done
        ? (curHit.row ? (curHit.wrong ? `${cur[0]} nie ma pary. Excel wziął najbliższy wiersz, ${curHit.row[0]}.` : `${cur[0]} ma parę w wierszu ${right.indexOf(curHit.row) + 1} tabeli status.`) : `${cur[0]} nie ma pary w tabeli status.`)
        : read));
  };
  draw();
  return frame(n, 'Jak formuła łączy dwie tabele przez id. Przełącz sposób i szukaj pary wiersz po wierszu', host,
    MADE_UP('Pięć filmów i ich status.'));
}

function flowFigure({ num: n = 'Rysunek' } = {}) {
  const st = { k: 0, playing: false };
  let timer = null;
  const host = el('div.dp-host');
  const draw = () => {
    const s = FLOW[st.k];
    mount(host,
      el('ol.fl-track', FLOW.map((x, i) => el('li', { class: ['fl-node', `fl-${x.who}`, i < st.k ? 'fl-past' : '', i === st.k ? 'fl-on' : ''].filter(Boolean).join(' ') },
        el('button', { type: 'button', 'aria-pressed': i === st.k ? 'true' : 'false', 'aria-label': `etap ${i + 1}, ${x.name}`, onClick: () => { stop(false); st.k = i; draw(); } },
          el('span.fl-num', String(i + 1)), el('span.fl-name', x.name), x.id === 'json' ? el('span.fl-loop', { 'aria-hidden': 'true' }, '↺') : null)))),
      el('div.fl-legend', Object.entries(WHO).map(([k, v]) => el(`span.fl-leg.fl-${k}`, v))),
      el('div.fl-panel',
        el('div.fl-head', el('span.fl-badge', `${st.k + 1}/${FLOW.length}`), el('b', s.name), el('span.fl-who', WHO[s.who]),
          el('a.fl-link', { href: `#${s.sec}` }, `${s.step} →`)),
        el('div.sq-read', { 'aria-live': 'polite' }, s.say),
        s.show(),
        el('div.fl-shape', 'Po tym etapie: ', el('b', s.shape))),
      el('div.ap-controls',
        el('button.fg-toggle', { type: 'button', 'aria-label': 'poprzedni etap', onClick: () => go(st.k - 1) }, '‹'),
        el('button.fg-toggle', { type: 'button', onClick: () => (st.playing ? stop() : play()) }, st.playing ? '⏸ Pauza' : '▶ Odtwórz drogę'),
        el('button.fg-toggle', { type: 'button', 'aria-label': 'następny etap', onClick: () => go(st.k + 1) }, '›')));
  };
  const stop = (redraw = true) => { clearTimeout(timer); st.playing = false; if (redraw) draw(); };
  const go = (k) => { stop(false); st.k = (k + FLOW.length) % FLOW.length; draw(); };
  // each stage stays about four seconds (the page loop a little longer); the film stops on the last one
  const tick = () => {
    st.k += 1;
    if (st.k >= FLOW.length - 1) { st.k = FLOW.length - 1; stop(); return; }
    draw();
    timer = setTimeout(tick, FLOW[st.k].id === 'json' ? 5500 : 4000);
  };
  const play = () => {
    clearTimeout(timer);
    if (reduced()) { go(st.k + 1); return; }
    st.playing = true;
    if (st.k >= FLOW.length - 1) st.k = -1;
    tick();
  };
  draw();
  return frame(n, 'Cała droga danych, od zapytania do jednej tabeli. Odtwórz albo kliknij etap', host,
    el('div.fg-caption', `Liczby stron, trafień i filmów pochodzą z testu. Wiersz w ostatnim etapie to film_001 z plików rozdziału. ${SYNTH}`));
}
