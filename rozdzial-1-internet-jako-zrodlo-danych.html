.pa-row { display: grid; grid-template-columns: 1fr 80px 80px; gap: 8px; font-size: 13px; align-items: center; }
.pa-head { font: 700 10px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); }
.pa-val { font-family: var(--mono); }
.pa-key::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 2px solid var(--line-strong); }
.pa-key.pa-czasem::before { border-color: var(--accent); background: var(--accent-mid); }
.pa-key.pa-duzo::before { border-color: var(--err); background: var(--err); }
.pa-key.pa-widzi::before { border-color: var(--accent); background: var(--accent); }
.pa-key.pa-nie::before { border-style: dashed; }
.pa-ask { font: 600 13px var(--sans); color: var(--ink-soft); }
.pa-tabs { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.pa-dots { margin: 4px 0; }

/* figure: three uses of traces (Salganik) */
.us-card { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-panel); }
.us-what { font: 600 15px/1.45 var(--sans); }
.us-ex { display: grid; grid-template-columns: 80px 1fr; gap: 8px; font-size: 13px; line-height: 1.45; }
.us-label { font: 700 10px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); padding-top: 2px; }
.us-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.us-today { font: 600 13px var(--sans); }
.us-gap { fill: var(--warn-bg); }
.us-now { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; }
.us-read { font-size: 13px; line-height: 1.45; color: var(--ink-soft); }

/* figure: decision tree for using a post */
.ct-path { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.ct-done { font-size: 13px; color: var(--ink-soft); }

  const keys = tb.rows.map((r) => r[tb.key]);
  return {
    pic: el('div.pc-stack',
      renderTable(tb, {
        keep: kept, marks, litCols,
        extra: { head: 'gdzie', cell: (_, key) => tick(mask[keys.indexOf(key)]) },
      }),
      legend),
    caption,
    tone: !isColumn && tb.truth && (marks && Object.values(marks).some((m) => m === 'fp' || m === 'fn')) ? 'trap' : null,
  };
}

// ---------------------------------------------------------------------------
// operators
// ---------------------------------------------------------------------------

const OP_TEXT = { '=': '=', '!=': '≠', '<': '<', '>': '>', '<=': '≤', '>=': '≥', '+': '+', '-': '−', '*': '×', '/': '÷' };

function binary(entry, ctx) {
  const { node } = entry;
  const op = node.op;
  if (op === 'i' || op === 'lub') return logic(entry, ctx);
  if (op === 'zawiera') return containsPic(entry, ctx);
  const left = childFor(entry, node.left)?.value;
  const right = childFor(entry, node.right)?.value;
  const v = entry.value;
  const compare = ['=', '!=', '<', '>', '<=', '>='].includes(op);

  if (!isVec(v)) {
    if (op === '/') {
      return {
        pic: fraction(numText(left), numText(right), numText(v), { partLabel: t('fx.numerator'), wholeLabel: t('fx.denominator') }),
        caption: t('fx.div', { a: numText(left), b: numText(right), c: numText(v) }),
      };
    }
    return {
      pic: el('div.pc-eq', el('span', scalarText(left)), el('span.pc-eq-op', OP_TEXT[op] || op), el('span', scalarText(right)), el('span.pc-eq-op', '='), el('b', scalarText(v))),
      caption: compare ? t('fx.cmp.scalar', { r: v.v ? 'tak' : 'nie' }) : t('fx.arith', { c: scalarText(v) }),
    };
  }

  // one row per key: left op right = result
  const rows = v.keys.map((key, i) => ({
    key,
    a: isVec(left) ? left.values[left.keys.indexOf(key)] : left.v,
    b: isVec(right) ? right.values[right.keys.indexOf(key)] : right.v,
    r: v.values[i],
  }));
  const lType = isVec(left) ? left.type : left.kind;
  const rType = isVec(right) ? right.type : right.kind;
  const table = el('div.tb-wrap', el('table.tb.tb-pairs',
    el('thead', el('tr',
      el('th.tb-key', v.keyName || ''),
      el('th', short(oneLine(codeOf(childFor(entry, node.left), ctx.source)), 22)),
      el('th.tb-op', OP_TEXT[op] || op),
      el('th', short(oneLine(codeOf(childFor(entry, node.right), ctx.source)), 22)),
      el('th.tb-op', '='),
      el('th.tb-lit', compare ? t('fx.yesNo') : t('fx.result')))),
    el('tbody', rows.map((r) => el('tr', { class: compare && !r.r ? 'tb-out' : '' },
      el('td.tb-key', String(r.key)),
      el('td.tb-num', fmtScalar(r.a, lType)),
      el('td.tb-op', OP_TEXT[op] || op),
      el('td.tb-num', fmtScalar(r.b, rType)),
      el('td.tb-op', '='),
      el('td.tb-lit.tb-num', compare ? tick(r.r) : fmtScalar(r.r, 'num')))))));

  if (compare) {
    const k = v.values.filter(Boolean).length;
    const hint = v.meta?.caseHint;
    return { pic: table, caption: t('fx.cmp', { k, n: v.values.length }) + (hint ? ` ${t('fx.where.case', hint)}` : ''), tone: hint ? 'trap' : null };
  }
  const bothSeries = isVec(left) && isVec(right);
  let caption = op === '/' && bothSeries
    ? t('fx.div.pairs', { n: v.values.length })
    : bothSeries ? t('fx.arith.pairs', { n: v.values.length }) : t('fx.arith.broadcast', { s: scalarText(isVec(left) ? right : left), n: v.values.length });
  // The result drawn as a chart too, with the largest lit: a ranking that flips
  // after dividing (accounts, months) is seen at once, not read off a table.
  let chart = null;
  if (v.type === 'num' && v.values.length <= 40) {
    const best = maxIndex(v.values);
    chart = renderSeries(v, { lit: (_, i) => i === best, height: 90 });
    caption += ` ${t('fx.peak', { key: v.keys[best] })}`;
  }
  return { pic: el('div.pc-stack', table, chart), caption };
}

function scalarText(v) {
  if (!v) return '—';
  if (v.kind === 'num') return numText(v);
  if (v.kind === 'str') return `„${v.v}”`;
  if (v.kind === 'bool') return v.v ? 'tak' : 'nie';
  return '—';
}

const maxIndex = (xs) => xs.reduce((best, x, i) => (x != null && (best === -1 || x > xs[best]) ? i : best), -1);

function logic(entry, ctx) {
  const { node } = entry;
  const v = entry.value;
  const parts = node.op === 'nie' ? [childFor(entry, node.operand)] : [childFor(entry, node.left), childFor(entry, node.right)];
  if (!isVec(v)) {
    return { pic: renderValue(v), caption: t(`fx.logic.${node.op}`, { k: v.v ? 1 : 0, n: 1 }) };
  }
  const valueAt = (pv, key) => (isVec(pv) ? pv.values[pv.keys.indexOf(key)] : pv?.v);
  const table = el('div.tb-wrap', el('table.tb.tb-pairs',
    el('thead', el('tr',
      el('th.tb-key', v.keyName || ''),
      parts.map((p) => el('th', short(oneLine(codeOf(p, ctx.source)), 24))),
      el('th.tb-lit', node.op))),
    el('tbody', v.keys.map((key, i) => el('tr', { class: v.values[i] ? '' : 'tb-out' },
      el('td.tb-key', String(key)),
      parts.map((p) => el('td', tick(!!valueAt(p?.value, key)))),
      el('td.tb-lit', tick(v.values[i])))))));
  const k = v.values.filter(Boolean).length;
  return { pic: table, caption: t(`fx.logic.${node.op}`, { k, n: v.values.length }) };
}

function containsPic(entry) {
  const v = entry.value;
  if (!isVec(v)) return { pic: renderValue(v), caption: t('fx.contains.one', { r: v.v ? 'tak' : 'nie' }) };
  const { needle, matches, texts } = v.meta.contains;
  const row = (text, m) => {
    if (!m) return el('span', text);
    return el('span', text.slice(0, m[0]), el('mark.pc-match', text.slice(m[0], m[1])), text.slice(m[1]));
  };
  const table = el('div.tb-wrap', el('table.tb',
    el('thead', el('tr', el('th.tb-key', v.keyName || ''), el('th', 'tekst'), el('th.tb-lit', 'zawiera?'))),
    el('tbody', v.keys.map((key, i) => el('tr', { class: matches[i] ? '' : 'tb-out' },
      el('td.tb-key', String(key)),
      el('td.tb-text', row(String(texts[i] ?? ''), matches[i])),
      el('td.tb-lit', tick(!!matches[i])))))));
  const k = matches.filter(Boolean).length;
  return { pic: table, caption: t('fx.contains', { needle, k, n: texts.length }) };
}

// ---------------------------------------------------------------------------
// functions
// ---------------------------------------------------------------------------

function call(entry, ctx) {
  const v = entry.value;
  const name = entry.node.name;
  const fn = resolveName(name, ['liczba', 'udział', 'suma', 'średnia', 'mediana', 'max', 'min', 'unikalne', 'zaokr', 'sortuj', 'trend', 'sesje', 'profil', 'średnia_ruchoma', 'wykres', 'zgodność', 'kappa']) || name;
  switch (fn) {
    case 'liczba': return countPic(v);
    case 'udział': return sharePic(v);
    case 'suma': case 'średnia': case 'mediana': case 'max': case 'min': return aggPic(fn, v);
    case 'unikalne': return uniquePic(v);
    case 'zaokr': return roundPic(v);
    case 'sortuj': return {
      pic: bars(v.keys.map((k, i) => ({ key: `${i + 1}. ${k}`, value: v.values[i], cls: i === 0 ? 'pc-lit' : '' }))),
      caption: t('fx.sort', { first: v.keys[0] }),
    };
    case 'trend': return trendPic(v);
    case 'sesje': return sessionsPic(v, ctx);
    case 'profil': return profilePic(v);
    case 'średnia_ruchoma': return movingPic(v);
    case 'wykres': return chartPic(v);
    case 'zgodność': case 'kappa': return agreementPic(v);
    default: return { pic: picOf(v), caption: '' };
  }
}

function countPic(v) {
  const of = v.count.of;
  const n = v.v;
  const labels = isTab(of) ? of.rows.map((r) => r[of.label || of.key]) : of.keys.map(String);
  const pic = el('div.pc-funnel',
    el('div.pc-tiles', labels.slice(0, 40).map((l) => el('span.pc-tile.pc-tile-on', String(l)))),
    el('div.pc-funnel-arrow', '↓'),
    el('div.pc-big', fmtNum(n)));
  const caption = isTab(of)
    ? t('fx.count.rows', { count: unitCount(n, of) })
    : of.meta?.unique ? t('fx.count.unique', { n }) : t('fx.count.values', { n });
  return { pic, caption };
}

// Landis & Koch (1977): the conventional reading of kappa.
const KAPPA_LEVELS = [[0.2, 'slight'], [0.4, 'fair'], [0.6, 'moderate'], [0.8, 'substantial'], [Infinity, 'perfect']];
const kappaLevel = (k) => (k <= 0 ? 'none' : KAPPA_LEVELS.find(([top]) => k <= top)[1]);

function agreementPic(v) {
  const g = v.meta?.agreement || v.agreement;
  const code = (c) => (c === true ? t('fx.yes') : c === false ? t('fx.no') : typeof c === 'number' ? fmtNum(c) : String(c));
  const big = g.cats.length > 2;
  const cell = (keys, same) => el('td', { class: same ? 'pc-agree-same' : keys.length ? 'pc-agree-diff' : 'pc-agree-empty' },
    el('div.pc-agree-n', String(keys.length)), keys.length ? el('div.pc-agree-keys', keys.join(' ')) : null);
  const table = el('div.pc-agree-wrap', el(`table.pc-agree${big ? '.pc-agree-big' : ''}`,
    el('thead', el('tr', el('th'), el('th', { colspan: String(g.cats.length) }, g.b.column || g.b.name)),
      el('tr', el('th.pc-agree-corner', g.a.column || g.a.name), ...g.cats.map((c) => el('th', code(c))))),
    el('tbody', ...g.cats.map((c, i) => el('tr', el('th', code(c)), ...g.cats.map((_, j) => cell(g.m[i][j], i === j)))))));
  const unit = unitOf(g.a.table);
  if (v.agreement.kappa === undefined) {
    return {
      pic: el('div.pc-stack', table, fraction(String(g.same), String(g.n), fmtPct(g.po), { partLabel: t('fx.agree.same'), wholeLabel: t('fx.agree.all') })),
      caption: t('fx.agree', { k: g.same, n: g.n, unit, pct: fmtPct(g.po) }),
    };
  }
  const k = v.agreement.kappa;
  return {
    pic: el('div.pc-stack', table, bars([
      { key: t('fx.kappa.observed'), value: g.po, cls: 'pc-lit' },
      { key: t('fx.kappa.chance'), value: g.pe },
    ], { max: 1, fmt: fmtPct })),
    caption: `${t('fx.kappa', { po: fmtNum(Math.round(g.po * 1000) / 1000), pe: fmtNum(Math.round(g.pe * 1000) / 1000), k: fmtNum(Math.round(k * 1000) / 1000) })} ${t(`fx.kappa.level.${kappaLevel(k)}`)}`,
  };
}

function sharePic(v) {
  const { part, whole, of, source } = v.share;
  if (!source) {
    // a yes/no series
    const tiles = of.keys.map((k, i) => el('span', { class: `pc-tile ${of.values[i] ? 'pc-tile-on' : 'pc-tile-den'}` }, String(k)));
    return {
      pic: el('div.pc-stack', el('div.pc-tiles', tiles), fraction(String(part), String(whole), fmtPct(v.v), { partLabel: t('fx.numerator'), wholeLabel: t('fx.denominator') })),
      caption: t('fx.share.bool', { k: part, n: whole, pct: fmtPct(v.v) }),
    };
  }
  // the chain of filters: root table -> ... -> source (denominator) -> of (numerator)
  let root = source;
  while (root.meta?.source) root = root.meta.source;
  const table = isVec(root) ? root.table : root;
  const keyOf = (x) => (isVec(x) ? x.keys : x.rows.map((r) => r[x.key]));
  const inPart = new Set(keyOf(of));
  const inWhole = new Set(keyOf(source));
  const rootKeys = keyOf(root);
  const byKey = new Map(table.rows.map((r) => [r[table.key], r]));
  const tiles = rootKeys.map((k) => {
    const row = byKey.get(k);
    const label = row ? row[table.label || table.key] : k;
    const cls = inPart.has(k) ? 'pc-tile-on' : inWhole.has(k) ? 'pc-tile-den' : 'pc-tile-out';
    return el('span', { class: `pc-tile ${cls}`, title: String(k) }, String(label));
  });
  const chained = !!source.meta?.source;
  const legend = el('div.pc-legend',
    el('span.pc-leg.pc-leg-on', t('fx.leg.numerator')),
    el('span.pc-leg.pc-leg-den', t('fx.leg.denominator')),
    chained ? el('span.pc-leg.pc-leg-out', t('fx.leg.outside')) : null);
  const count = unitCount(whole, table);
  return {
    pic: el('div.pc-stack',
      el('div.pc-tiles', tiles),
      legend,
      fraction(String(part), String(whole), fmtPct(v.v), { partLabel: t('fx.numerator'), wholeLabel: t('fx.denominator') })),
    caption: chained
      ? t('fx.share.chain', { k: part, count, pct: fmtPct(v.v), out: rootKeys.length - whole })
      : t('fx.share.all', { k: part, count, name: table.name, pct: fmtPct(v.v) }),
  };
}

function aggPic(fn, v) {
  const { values, skipped, parts } = v.agg;
  const xs = values.filter((x) => x != null);
  const sorted = [...xs].sort((a, b) => a - b);
  let pic;
  let caption;
  let tone = null;
  if (fn === 'mediana') {
    const m = sorted.length >> 1;
    const mid = sorted.length % 2 ? [m] : [m - 1, m];
    pic = el('div.pc-stack',
      el('div.pc-sorted', sorted.map((x, i) => el('span', { class: `pc-chip ${mid.includes(i) ? 'pc-chip-lit' : ''}` }, fmtNum(x)))),
      dotStrip(xs, [{ at: v.v, label: t('fx.mark.median', { v: fmtNum(v.v) }), cls: 'pc-mark-median' }]));
    caption = sorted.length % 2
      ? t('fx.median.odd', { n: sorted.length, v: fmtNum(v.v) })
      : t('fx.median.even', { n: sorted.length, a: fmtNum(sorted[m - 1]), b: fmtNum(sorted[m]), v: fmtNum(v.v) });
  } else if (fn === 'średnia') {
    const sum = xs.reduce((a, b) => a + b, 0);
    const med = sorted.length % 2 ? sorted[sorted.length >> 1] : (sorted[(sorted.length >> 1) - 1] + sorted[sorted.length >> 1]) / 2;
    const max = sorted[sorted.length - 1];
    pic = el('div.pc-stack',
      dotStrip(xs, [{ at: v.v, label: t('fx.mark.mean', { v: fmtNum(v.v) }), cls: 'pc-mark-mean' }], { lit: (_, x) => x === max && max > 5 * Math.max(1, med) }),
      fraction(fmtNum(sum), String(xs.length), fmtNum(v.v), { partLabel: t('fx.sum'), wholeLabel: t('fx.howMany') }));
    caption = t('fx.mean', { sum: fmtNum(sum), n: xs.length, v: fmtNum(v.v) });
    if (xs.length > 2 && max > 5 * Math.max(1, med)) {
      caption += ` ${t('fx.mean.outlier', { max: fmtNum(max) })}`;
      tone = 'trap';
    }
  } else if (fn === 'suma') {
    pic = el('div.pc-funnel',
      el('div.pc-sorted', xs.map((x) => el('span.pc-chip', fmtNum(x)))),
      el('div.pc-funnel-arrow', '↓ +'),
      el('div.pc-big', fmtNum(v.v)));
    caption = t('fx.sum.caption', { n: xs.length, v: fmtNum(v.v) });
  } else {
    pic = el('div.pc-stack',
      el('div.pc-sorted', sorted.map((x) => el('span', { class: `pc-chip ${x === v.v ? 'pc-chip-lit' : ''}` }, fmtNum(x)))));
    caption = parts > 1
      ? t(`fx.${fn}.parts`, { parts, v: fmtNum(v.v) })
      : t(`fx.${fn}`, { n: xs.length, v: fmtNum(v.v) });
  }
  if (skipped) caption += ` ${t('fx.agg.skipped', { n: skipped })}`;
  return { pic, caption, tone };
}

function uniquePic(v) {
  const { source, counts } = v.meta.unique;
  return {
    pic: el('div.pc-funnel',
      el('div.pc-tiles', source.values.map((x) => el('span.pc-tile', fmtScalar(x, source.type)))),
      el('div.pc-funnel-arrow', '↓'),
      el('div.pc-tiles', v.values.map((x, i) => el('span.pc-tile.pc-tile-on', fmtScalar(x, v.type), el('span.pc-times', `×${counts[i]}`))))),
    caption: t('fx.unique', { n: source.values.length, k: v.values.length }),
  };
}

function roundPic(v) {
  const { before, digits } = v.meta?.round || v.round || {};
  const after = isVec(v) ? v.values : [v.v];
  const keys = isVec(v) ? v.keys : [''];
  const shown = keys.slice(0, 12);
  const table = el('div.tb-wrap', el('table.tb.tb-pairs',
    el('tbody', shown.map((k, i) => el('tr',
      k !== '' ? el('td.tb-key', String(k)) : null,
      el('td.tb-num', fmtNum(before[i])),
      el('td.tb-op', '→'),
      el('td.tb-lit.tb-num', fmtNum(after[i])))))));
  let chart = null;
  let caption = digits ? t('fx.round', { d: digits }) : t('fx.round0');
  if (isVec(v) && v.ordered) {
    const best = maxIndex(v.values);
    chart = renderSeries(v, { lit: (_, i) => i === best, height: 90 });
    caption += ` ${t('fx.peak', { key: v.keys[best] })}`;
  }
  return { pic: el('div.pc-stack', chart, table), caption };
}

function trendPic(v) {
  const tr = v.meta.trend;
  const rows = tr.phrases.map((p, pi) => {
    const best = tr.maxAt.phrase === p ? tr.keys.indexOf(tr.maxAt.key) : -1;
    const col = (values, fmt, lit) => columns(tr.keys.map((k, i) => ({ key: k, value: values[i], cls: lit && i === best ? 'pc-lit' : '' })), { fmt, height: 64, showValues: false });
    return el('div.pc-trend', { class: `pc-trend pc-series-${pi}` },
      el('div.pc-trend-name', `„${p}”`),
      el('div.pc-trend-steps',
        el('div.pc-trend-step', el('div.pc-trend-label', t('fx.trend.raw')), col(tr.raw[pi], fmtNum)),
        el('div.pc-trend-arrow', '÷'),
        el('div.pc-trend-step', el('div.pc-trend-label', t('fx.trend.share')), col(tr.share[pi], (x) => fmtPct(x), true)),
        el('div.pc-trend-arrow', '→'),
        el('div.pc-trend-step', el('div.pc-trend-label', t('fx.trend.index')), col(tr.index[pi], fmtNum, true))));
  });
  let caption = t('fx.trend', { key: tr.maxAt.key, phrase: tr.maxAt.phrase });
  if (!tr.full) caption += ` ${t('fx.trend.window', { from: tr.window[0], to: tr.window[1] })}`;
  if (tr.phrases.length > 1) caption += ` ${t('fx.trend.shared')}`;
  return { pic: el('div.pc-stack', rows, v.kind === 'multi' ? renderMulti(v) : null), caption };
}

function sessionsPic(v, ctx) {
  const s = v.meta.sessions;
  const times = s.events.rows.map((r) => r[s.timeCol]);
  const lo = Math.floor(Math.min(...times) / 60) * 60;
  const hi = Math.ceil((Math.max(...times) + 1) / 60) * 60;
  const pos = (m) => `${((m - lo) / (hi - lo)) * 100}%`;
  const ticks = [];
  const step = hi - lo > 8 * 60 ? 180 : 60;
  for (let m = lo; m <= hi; m += step) ticks.push(m);
  const colourOf = new Map(s.list.map((ses) => [ses.sesja, s.list.filter((x) => x.użytkownik === ses.użytkownik).indexOf(ses) % 4]));
  const lit = ctx.show?.gap || null;
  const lanes = s.users.map((u) => {
    const mine = s.list.filter((ses) => ses.użytkownik === u);
    const gaps = s.gaps.filter((g) => g.user === u);
    const timeOf = (key) => s.events.rows.find((r) => r[s.events.key] === key)[s.timeCol];
    // Pauses that did NOT cut are listed by the name, not drawn on the track: three
    // of them within one hour would print over each other on a phone.
    const pauses = gaps.filter((g) => !g.cut && g.gap >= 5).map((g) => `${g.gap}′`);
    return el('div.tl-lane',
      el('div.tl-user', u,
        el('span.tl-count', t('fx.sessions.lane', { n: mine.length })),
        pauses.length ? el('span.tl-pauses', pauses.join(' ')) : null),
      el('div.tl-track',
        mine.map((ses) => el('div', {
          class: `tl-band tl-c${colourOf.get(ses.sesja)}`,
          style: { left: pos(ses.początek), width: `calc(${((ses.koniec - ses.początek) / (hi - lo)) * 100}% + 10px)` },
          title: `${ses.sesja}: ${fmtTime(ses.początek)}–${fmtTime(ses.koniec)}`,
        }, el('span.tl-band-label', ses.sesja))),
        mine.flatMap((ses) => ses.events.map((key) => el('span', { class: `tl-dot tl-c${colourOf.get(ses.sesja)}`, style: { left: pos(timeOf(key)) }, title: fmtTime(timeOf(key)) }))),
        gaps.filter((g) => g.cut).map((g) => {
          const a = timeOf(g.from);
          const b = timeOf(g.to);
          return el('span', {
            class: ['tl-gap', 'tl-cut', lit && lit === g.to ? 'tl-gap-lit' : ''].filter(Boolean).join(' '),
            style: { left: pos((a + b) / 2) },
          }, `✂ ${g.gap} min`);
        })));
  });
  return {
    pic: el('div.tl',
      el('div.tl-axis', ticks.map((m, i) => el('span', { class: `tl-tick ${i === ticks.length - 1 ? 'tl-tick-end' : ''}`, style: { left: pos(m) } }, fmtTime(m)))),
      lanes,
      el('div.tl-rule', t('fx.sessions.rule', { gap: s.timeout })),
      el('div.tl-rule', t('fx.sessions.pauses'))),
    caption: t('fx.sessions', { k: v.rows.length, n: s.events.rows.length, gap: s.timeout }),
  };
}

function profilePic(v) {
  const p = v.meta.profile;
  const lookups = el('div.pf-lookups', p.lookups.map((l) => el('div', {
    class: `pf-row ${l.categories.length ? '' : 'pf-out'} ${l.categories.length > 1 ? 'pf-double' : ''}`,
    dataset: { link: l.categories[0] || p.outside },
  },
  el('span.pf-tag', l.label, el('span.pc-times', `×${l.count}`)),
  el('span.pf-arrow', '→'),
