<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rozdział 1 · Internet jako źródło danych</title>
<style>
/*
 * Visual language.
 *
 * One accent (teal) means "look here": the selected part of the material, the rows
 * that stay, the numerator. The denominator is the same colour, outlined; what is
 * outside the denominator is dashed and faint. Red is a false alarm, a dashed amber
 * outline something that should be there and is not. Everything is a token, with a
 * dark theme for each. Shell, code box and lesson styles come from the R trainer.
 */

:root {
  color-scheme: light;
  --bg: #f4f5f3;
  --bg-panel: #ffffff;
  --bg-sunken: #eef0ed;
  --code-bg: #fbfbfa;
  --ink: #1b1d1c;
  --ink-soft: #505654;
  --ink-faint: #858b88;
  --line: #e0e3e0;
  --line-strong: #c4c9c5;

  --accent: #0d6f7b;
  --accent-ink: #ffffff;
  --accent-soft: #e3f2f3;
  --accent-mid: #9fd0d5;

  --series-0: #0d6f7b;
  --series-1: #7b4bb3;

  --tk-num: #0b6b5d;
  --tk-str: #9a4a12;
  --tk-fn: #1d5fa0;
  --tk-key: #6b3fb0;
  --tk-op: #6b665e;
  --tk-com: #948f86;
  --tk-id: #1b1d1c;

  --warn: #93600f;
  --warn-bg: #fdf4e3;
  --err: #b1322b;
  --err-bg: #fcecea;
  --ok: #2a6c47;
  --ok-bg: #e6f3eb;

  --radius: 8px;
  --shadow: 0 1px 2px rgba(20, 30, 28, .06), 0 4px 16px rgba(20, 30, 28, .05);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121615; --bg-panel: #1a1f1e; --bg-sunken: #232928; --code-bg: #161b1a;
    --ink: #e7ebe9; --ink-soft: #aab3b0; --ink-faint: #76807c; --line: #2d3432; --line-strong: #434c49;
    --accent: #4fc0cb; --accent-ink: #0e1a1b; --accent-soft: #173336; --accent-mid: #2b6a70;
    --series-0: #4fc0cb; --series-1: #b893f0;
    --tk-num: #7fd6c6; --tk-str: #f0b27f; --tk-fn: #8fbff0; --tk-key: #c3a6f5; --tk-op: #aaa49b; --tk-com: #6f6a63; --tk-id: #e7ebe9;
    --warn: #e0ab5f; --warn-bg: #342a17; --err: #ef8b84; --err-bg: #3a1f1e; --ok: #79c79a; --ok-bg: #173024;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121615; --bg-panel: #1a1f1e; --bg-sunken: #232928; --code-bg: #161b1a;
  --ink: #e7ebe9; --ink-soft: #aab3b0; --ink-faint: #76807c; --line: #2d3432; --line-strong: #434c49;
  --accent: #4fc0cb; --accent-ink: #0e1a1b; --accent-soft: #173336; --accent-mid: #2b6a70;
  --series-0: #4fc0cb; --series-1: #b893f0;
  --tk-num: #7fd6c6; --tk-str: #f0b27f; --tk-fn: #8fbff0; --tk-key: #c3a6f5; --tk-op: #aaa49b; --tk-com: #6f6a63; --tk-id: #e7ebe9;
  --warn: #e0ab5f; --warn-bg: #342a17; --err: #ef8b84; --err-bg: #3a1f1e; --ok: #79c79a; --ok-bg: #173024;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
code { font-family: var(--mono); }

@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

/* ===================== application shell ===================== */

#root { height: 100%; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

.top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; margin-right: 6px; }
a.brand-link { color: inherit; text-decoration: none; border-radius: 8px; }
a.brand-link:hover .brand-mark, a.brand-link:focus-visible .brand-mark { outline: 2px solid var(--accent); outline-offset: 2px; }
.site-nav { display: grid; gap: 2px; margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.site-nav-link { display: block; padding: 8px 10px; border-radius: 8px; color: var(--accent); font: 600 14px var(--sans); text-decoration: none; }
.site-nav-link:hover, .site-nav-link:focus-visible { background: var(--bg-sunken); }
.brand-mark {
  display: grid; place-items: center;
  width: 30px; height: 30px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-ink);
  font: 800 17px var(--sans);
}
.brand-name { font: 700 14px var(--sans); color: var(--ink-soft); white-space: nowrap; }
.top-menu {
  display: inline-flex; align-items: center; gap: 10px;
  min-width: 0;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--bg-sunken);
  cursor: pointer;
  font-weight: 600;
}
.top-menu:hover { border-color: var(--accent); }
.top-menu-icon { color: var(--accent); }
.top-lesson-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-sandbox {
  margin-left: auto;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: transparent;
  cursor: pointer;
  color: var(--ink-soft);
  white-space: nowrap;
}
.top-sandbox:hover { border-color: var(--accent); color: var(--ink); }

.main {
  display: grid;
  grid-template-columns: minmax(380px, 44%) minmax(0, 1fr);
  gap: 16px;
  padding: 16px;
  min-height: 0;
}
.pane-left, .pane-right { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.pane-left {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.pane-right { display: grid; grid-template-rows: auto auto; align-content: start; gap: 16px; }
.stage, .data {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 12px 16px 16px;
  min-width: 0;
}
.pane-title { font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); margin-bottom: 8px; }

/* ===================== the code box ===================== */

.cb-wrap {
  position: relative;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--code-bg);
  overflow: hidden;
}
.cb-wrap:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.cb-layer, .cb-input {
  margin: 0;
  padding: 12px 14px;
  font: 500 15px/1.65 var(--mono);
  white-space: pre;
  tab-size: 2;
  letter-spacing: 0;
  word-spacing: 0;
}
.cb-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  color: var(--ink);
  pointer-events: none;
}
.cb-input {
  position: relative;
  display: block;
  width: 100%;
  resize: none;
  border: 0;
  outline: none;
  background: transparent;
  color: transparent;
  caret-color: var(--ink);
  overflow-x: auto;
  overflow-y: hidden;
  cursor: pointer;
}
.cb-input::placeholder { color: var(--ink-faint); }
.cb-input::selection { background: color-mix(in srgb, var(--accent) 22%, transparent); color: transparent; }

.tk-num { color: var(--tk-num); }
.tk-str { color: var(--tk-str); }
.tk-fn  { color: var(--tk-fn); font-weight: 700; }
.tk-key { color: var(--tk-key); font-weight: 700; }
.tk-op  { color: var(--tk-op); }
.tk-com { color: var(--tk-com); font-style: italic; }

.cb-hov { background: color-mix(in srgb, var(--ink) 8%, transparent); border-radius: 3px; }
.cb-sel {
  background: color-mix(in srgb, var(--accent) 20%, transparent);
  box-shadow: inset 0 -2px 0 var(--accent);
  border-radius: 3px;
}
.cb-tap { animation: tap-pulse 1.4s ease-in-out infinite; border-radius: 3px; }
@keyframes tap-pulse {
  0%, 100% { background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: 0 0 0 0 transparent; }
  50%      { background: color-mix(in srgb, var(--accent) 38%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
}
.cb-err { text-decoration: underline wavy var(--err); text-underline-offset: 4px; background: var(--err-bg); }

.cb-chips { position: absolute; inset: 0; pointer-events: none; }
.cb-chip {
  position: absolute;
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink-faint);
  cursor: pointer;
  white-space: nowrap;
  opacity: .85;
}
.cb-chip:hover { background: var(--accent-soft); opacity: 1; }
.cb-chip-arrow { color: var(--accent); font: 600 12px var(--mono); }
.cb-chip-val { display: inline-flex; align-items: center; gap: 4px; }
.cb-chip-err { color: var(--err); font-weight: 800; }

/* ===================== live code: tools and console ===================== */

.lv { position: relative; display: grid; gap: 8px; }
.lv-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-height: 30px; }
.lv-order {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 4px 2px 10px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--bg-sunken);
}
.lv-order-label { font: 600 11px var(--sans); color: var(--ink-faint); margin-right: 4px; }
.lv-order-pos { font: 600 12px var(--mono); color: var(--ink-soft); min-width: 44px; text-align: center; }
.lv-btn {
  width: 26px; height: 26px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
}
.lv-btn:hover { background: var(--bg-panel); color: var(--accent); }
.lv-play { font-size: 10px; background: var(--accent); color: var(--accent-ink); }
.lv-play:hover { background: var(--accent); color: var(--accent-ink); filter: brightness(1.1); }
.lv-tap { display: inline-flex; align-items: center; gap: 6px; font: 600 13px var(--sans); color: var(--accent); }
.lv-tap-hand { display: inline-block; animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.lv-hint { font-size: 12px; color: var(--ink-faint); }

.lv-err { margin-top: 6px; padding: 8px 10px; border-radius: var(--radius); background: var(--err-bg); color: var(--err); font-size: 13px; }
.lv-err-help { margin-top: 6px; padding-top: 6px; border-top: 1px solid color-mix(in srgb, var(--err) 25%, transparent); color: var(--ink); }
.lv-err-title { font-weight: 700; }
.lv-err-text { color: var(--ink-soft); }
.lv-err-fix { margin: 6px 0 0; padding: 6px 8px; border-radius: 6px; background: var(--bg-panel); font: 12px var(--mono); white-space: pre-wrap; }

.lv-tip {
  position: absolute;
  z-index: 20;
  pointer-events: none;
  padding: 4px 6px;
  border-radius: 8px;
  background: var(--bg-panel);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
}
.lv-tip-err { color: var(--err); font: 600 12px var(--sans); }

/* ===================== the stage ===================== */

.stage-body { min-height: 240px; }
.st { display: grid; gap: 10px; }
.st-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.st-path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; width: 100%; }
.st-crumb {
  padding: 1px 7px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg-sunken);
  cursor: pointer;
  color: var(--ink-soft);
}
.st-crumb code { font-size: 11px; }
.st-crumb:hover { border-color: var(--accent); color: var(--ink); }
.st-crumb + .st-crumb::before { content: "›"; margin-right: 6px; color: var(--ink-faint); }
.st-crumb-sep { color: var(--ink-faint); }
.st-code { font: 600 15px var(--mono); padding: 3px 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 14%, transparent); box-shadow: inset 0 -2px 0 var(--accent); max-width: 100%; overflow-x: auto; white-space: nowrap; }
.st-times { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--sans); color: var(--ink-soft); padding: 2px 4px; border-radius: 20px; background: var(--bg-sunken); }
.st-mini-btn { width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 50%; background: var(--bg-panel); cursor: pointer; line-height: 1; }
.st-mini-btn:disabled { opacity: .35; cursor: default; }
.st-mini-btn:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
.st-replay { margin-left: auto; }
.st-pic { min-width: 0; overflow-x: auto; padding: 4px 2px 6px; }
.st-caption {
  padding: 9px 12px;
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  background: var(--accent-soft);
  font: 600 14px/1.45 var(--sans);
}
.st-trap .st-caption, .st-warn .st-caption { border-left-color: var(--warn); background: var(--warn-bg); }
.st-trap .st-caption::before, .st-warn .st-caption::before { content: "⚠ "; color: var(--warn); }
.st-error .st-caption { border-left-color: var(--err); background: var(--err-bg); }
.st-idle { display: grid; place-items: center; gap: 8px; min-height: 220px; color: var(--ink-faint); text-align: center; }
.st-idle-hand { font-size: 30px; animation: nudge 1.6s ease-in-out infinite; }

/* ===================== lesson ===================== */

.ls { display: grid; gap: 14px; padding: 18px 20px 20px; }
.ls-kicker { font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.ls-title { margin: 2px 0 0; font: 800 24px/1.2 var(--sans); letter-spacing: -.01em; }
.ls-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ls-dot {
  display: grid; place-items: center;
  min-width: 30px; height: 30px;
  padding: 0 8px;
  border: 1.5px solid var(--line-strong);
  border-radius: 15px;
  background: var(--bg-panel);
  cursor: pointer;
  font: 700 13px var(--sans);
  color: var(--ink-soft);
  transition: all .15s ease;
}
.ls-dot:hover { border-color: var(--accent); color: var(--accent); }
.ls-dot-past { background: var(--bg-sunken); color: var(--ink-faint); }
.ls-dot-on, .ls-dot-on:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ls-dot-play, .ls-dot-task { margin-left: 4px; }
.ls-dot-done { border-color: var(--ok); color: var(--ok); }
.ls-dot-done.ls-dot-on { background: var(--ok); color: var(--bg-panel); }
.ls-step { display: grid; gap: 12px; animation: rise .3s ease both; }
.ls-say { margin: 0; font: 600 19px/1.4 var(--sans); letter-spacing: -.005em; }
.ls-say strong { color: var(--accent); }
.ls-inline { font: 600 .92em var(--mono); padding: 0 5px; border-radius: 5px; background: var(--bg-sunken); border: 1px solid var(--line); }
.ls-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ls-chip {
  padding: 4px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--code-bg);
  cursor: pointer;
  text-align: left;
  white-space: pre;
}
/* a long variant wraps inside its chip instead of widening a phone screen */
.ls-chip { max-width: 100%; }
.ls-chip code { font: 500 13px var(--mono); white-space: normal; overflow-wrap: anywhere; }
.ls-chip:hover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ls-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.ls-nav-hint { font-size: 12px; color: var(--ink-faint); text-align: center; }
.ls-next {
  padding: 9px 18px;
  border: 0;
  border-radius: 22px;
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, black);
}
.ls-next:hover { filter: brightness(1.07); }
.ghost-btn {
  padding: 7px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 20px;
  background: var(--bg-panel);
  cursor: pointer;
  white-space: nowrap;
}
.ghost-btn:hover { border-color: var(--accent); color: var(--accent); }

.ls-goal:empty { display: none; }
.ls-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ls-check {
  padding: 8px 20px;
  border: 0;
  border-radius: 20px;
  background: var(--ok);
  color: var(--bg-panel);
  font-weight: 700;
  cursor: pointer;
}
.ls-check:hover { filter: brightness(1.08); }
.ls-verdict { padding: 10px 14px; border-radius: var(--radius); animation: pop .35s ease both; }
.ls-ok { background: var(--ok-bg); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
.ls-bad { background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.ls-verdict-title { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.ls-verdict-icon { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 13px; background: var(--bg-panel); }
.ls-ok .ls-verdict-icon { color: var(--ok); }
.ls-bad .ls-verdict-icon { color: var(--warn); }
.ls-verdict-note { margin-top: 4px; font-size: 14px; color: var(--ink-soft); }
.ls-verdict-next { margin-top: 10px; }
.ls-hints { display: grid; gap: 6px; }
.ls-hint { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: var(--radius); background: var(--bg-sunken); font-size: 14px; }
.ls-hint-num { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 700 11px var(--sans); }
.ls-solution { padding: 10px; border: 1px dashed var(--line-strong); border-radius: var(--radius); display: grid; gap: 8px; justify-items: start; }
.ls-solution-head { font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
.ls-code { margin: 0; font: 14px/1.6 var(--mono); white-space: pre; overflow-x: auto; }

/* ===================== lesson menu ===================== */

.menu { position: fixed; inset: 0; z-index: 50; }
.menu[hidden] { display: none; }
.menu-backdrop { position: absolute; inset: 0; background: rgba(20, 18, 16, .35); animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.menu-panel {
  position: absolute;
  top: 0; bottom: 0; left: 0;
  width: min(360px, 92vw);
  overflow-y: auto;
  padding: 14px;
  background: var(--bg-panel);
  box-shadow: var(--shadow);
  animation: slide .25s ease both;
}
@keyframes slide { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
.menu-head { display: flex; align-items: center; justify-content: space-between; font: 800 18px var(--sans); margin-bottom: 8px; }
.menu-close { border: 0; background: transparent; font-size: 24px; cursor: pointer; color: var(--ink-faint); }
.menu-module { margin-top: 12px; }
.menu-module-name { font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); margin: 0 0 4px 6px; }
.menu-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 7px 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  text-align: left;
}
.menu-item:hover { background: var(--bg-sunken); }
.menu-on { background: var(--accent-soft); }
.menu-num { display: grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--bg-sunken); font: 700 11px var(--sans); color: var(--ink-soft); }
.menu-done .menu-num { background: var(--ok-bg); color: var(--ok); }
.menu-title { font-weight: 600; }

/* ===================== narrow screens ===================== */

@media (max-width: 980px) {
  .app { height: auto; min-height: 100%; }
  .main { grid-template-columns: minmax(0, 1fr); padding: 10px 16px 24px; }
  .pane-left, .pane-right { overflow: visible; }
  .brand-name { display: none; }
}

@media (max-width: 640px) {
  .top { padding: 8px 12px; gap: 8px; }
  .top-sandbox { padding: 6px 10px; font-size: 13px; }
  .ls { padding: 14px; }
  .ls-say { font-size: 17px; }
  .ls-nav-hint { display: none; }
  .cb-layer, .cb-input { font-size: 14px; padding: 10px 12px; }
  .stage, .data { padding: 10px 12px 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}

.lv-slot:empty { display: none; }
.lv-slot > .stage { box-shadow: none; border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); padding: 10px 12px 12px; }
.lv-slot .stage-body { min-height: 0; }
.ls-task-bar { display: grid; gap: 8px; }
.ls-task-bar .ls-verdict-host:empty, .ls-task-bar .ls-hints-host:empty { display: none; }

/* Grid and flex children default to min-width: auto and grow to fit a long code
   line; every column in the lesson must be allowed to shrink and scroll instead. */
.ls > *, .ls-step > *, .lv > *, .st > *, .stage > *, .ls-task-bar > * { min-width: 0; }
.pane-left, .pane-right, .stage, .data { min-width: 0; }
.top-menu { flex: 0 1 auto; }
.top-sandbox { flex: none; }
/* The shell's single column must not grow to the header's natural width. */
.app { grid-template-columns: minmax(0, 1fr); }
.top { min-width: 0; }

/* ===================== extra tokens and stage pieces ===================== */

.tk-id { color: var(--tk-id); }
.tk-warn { color: var(--err); text-decoration: underline wavy var(--err); text-underline-offset: 4px; }
.tk-minus { color: var(--err); font-weight: 800; }

.lv-errs:empty { display: none; }
.lv-err b { margin-right: 4px; }
.mini { font: 600 12px var(--mono); color: var(--ink-soft); white-space: nowrap; }
.mini-num { color: var(--accent); }
.cb-chip .mini { color: inherit; }

.st-path-label { font: 600 11px var(--sans); color: var(--ink-faint); margin-right: 2px; }
.st-links { font-size: 12px; color: var(--ink-faint); }
.pc-error { padding: 10px 12px; border-radius: var(--radius); background: var(--err-bg); color: var(--err); font-weight: 600; }

.data-list { display: flex; flex-wrap: wrap; gap: 6px; }
.data-item {
  display: inline-flex; align-items: baseline; gap: 8px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--bg-sunken);
  cursor: pointer;
}
.data-item:hover { border-color: var(--accent); }
.data-name { font: 700 13px var(--mono); }
.data-sub { font-size: 12px; color: var(--ink-faint); }
.data-note { margin-top: 8px; font-size: 12px; color: var(--ink-faint); }
.menu-foot { margin: 18px 6px 4px; font-size: 12px; color: var(--ink-faint); line-height: 1.45; }

/* ===================== generic picture pieces ===================== */

.pc-stack { display: grid; gap: 10px; min-width: 0; }
.pc-stack > * { min-width: 0; }
.pc-big { font: 800 34px/1.1 var(--sans); letter-spacing: -.01em; color: var(--accent); padding: 4px 0; }
.pc-big.pc-text { font-size: 24px; color: var(--tk-str); }
.pc-empty { color: var(--ink-faint); }
.pc-note { font-size: 12px; color: var(--ink-faint); }
.pc-yes { color: var(--accent); font-weight: 800; }
.pc-no { color: var(--ink-faint); opacity: .7; }
.pc-match { background: color-mix(in srgb, var(--accent) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; box-shadow: 0 1px 0 var(--accent); }
.pc-times { margin-left: 4px; font: 700 10px var(--sans); color: var(--ink-faint); }
.pc-eq { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; font: 700 24px var(--sans); }
.pc-eq-op { color: var(--ink-faint); }
.pc-eq b { color: var(--accent); }

.pc-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-soft); }
.pc-leg { display: inline-flex; align-items: center; gap: 6px; }
.pc-leg::before { content: ""; width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--accent); background: var(--accent); }
.pc-leg-den::before { background: transparent; }
.pc-leg-out::before { background: transparent; border: 2px dashed var(--line-strong); }
.pc-leg-col::before { background: var(--accent-mid); border-color: var(--accent-mid); }
.pc-leg-lit::before { background: var(--accent); }
.pc-leg-mark::before { height: 3px; border-width: 0; border-radius: 2px; background: var(--series-1); }
.tb-tp-leg::before { background: var(--accent-soft); }
.tb-fp-leg::before { background: var(--err-bg); border-color: var(--err); }
.tb-fn-leg::before { background: transparent; border: 2px dashed var(--warn); }

/* tables */
.tb-wrap { max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
.tb { border-collapse: collapse; width: 100%; font-size: 13px; }
.tb th, .tb td { padding: 4px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.tb th { font: 700 11px var(--sans); color: var(--ink-faint); background: var(--bg-sunken); position: sticky; top: 0; white-space: nowrap; }
.tb tr:last-child td { border-bottom: 0; }
.tb .tb-key { font-weight: 700; white-space: nowrap; }
.tb .tb-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tb .tb-text { min-width: 220px; }
.tb .tb-op { color: var(--ink-faint); text-align: center; padding-left: 2px; padding-right: 2px; }
.tb .tb-lit { background: var(--accent-soft); }
.tb th.tb-lit { color: var(--accent); }
.tb .tb-extra { text-align: center; width: 1%; white-space: nowrap; }
.tb-true { color: var(--accent); font-weight: 700; }
.tb-false { color: var(--ink-faint); }
.tb-row.tb-out td, tr.tb-out td { opacity: .42; }
tr.tb-out td.tb-extra { opacity: 1; }
/* rows a filter dropped keep one line of text, so the kept rows are easy to find */
tr.tb-out td.tb-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
tr.tb-fp td { background: var(--err-bg); }
tr.tb-fp td:first-child { box-shadow: inset 3px 0 0 var(--err); }
tr.tb-fn td { opacity: 1; }
tr.tb-fn td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
tr.tb-fn { outline: 2px dashed var(--warn); outline-offset: -2px; }
tr.tb-tp td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.tb-more { padding: 4px 8px; font-size: 12px; color: var(--ink-faint); }
.tb-pairs td, .tb-pairs th { padding: 3px 7px; }

/* bars */
.pc-bars { display: grid; gap: 4px; min-width: 0; }
.pc-bars-head { font: 700 11px var(--sans); color: var(--ink-faint); }
.pc-bar-row { display: grid; grid-template-columns: minmax(3em, var(--kw, 8em)) minmax(40px, 1fr) minmax(var(--vw, 3em), auto); align-items: center; gap: 8px; border-radius: 6px; padding: 1px 4px; }
.pc-bar-val { text-align: right; }
.pc-bar-key { font: 600 13px var(--sans); overflow-wrap: anywhere; }
.pc-bar-track { height: 16px; border-radius: 4px; background: var(--bg-sunken); overflow: hidden; }
.pc-bar-fill { display: block; height: 100%; border-radius: 4px; background: var(--accent-mid); }
.pc-bar-row.pc-lit .pc-bar-fill { background: var(--accent); }
.pc-bar-val { font: 700 13px var(--sans); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pc-bar-note { margin-left: 4px; font-weight: 500; color: var(--ink-faint); }
.pc-bar-out .pc-bar-fill { background: repeating-linear-gradient(45deg, var(--line-strong) 0 4px, transparent 4px 8px); }
.pc-bar-out .pc-bar-key { color: var(--ink-faint); font-style: italic; }
.pc-bar-row.cmp-diff { outline: 2px solid var(--err); }
.pc-bar-row.cmp-missing { outline: 2px dashed var(--warn); }

/* columns */
.pc-cols { display: flex; align-items: flex-end; gap: 2px; min-width: 0; overflow-x: auto; padding-bottom: 2px; }
.pc-col { flex: 1 1 0; min-width: 9px; display: grid; grid-template-rows: auto var(--h, 120px) auto; gap: 2px; text-align: center; }
.pc-col-val { font: 600 10px var(--sans); color: var(--ink-soft); white-space: nowrap; min-height: 13px; }
.pc-col-area { position: relative; display: flex; align-items: flex-end; border-bottom: 1px solid var(--line-strong); }
.pc-col-fill { width: 100%; background: var(--accent-mid); border-radius: 3px 3px 0 0; }
.pc-col.pc-lit .pc-col-fill { background: var(--accent); }
.pc-col.pc-lit .pc-col-val { color: var(--accent); font-weight: 800; }
.pc-col-none .pc-col-area::after { content: "—"; position: absolute; bottom: 2px; left: 0; right: 0; color: var(--ink-faint); font-size: 10px; }
.pc-col-mark { position: absolute; left: -1px; right: -1px; height: 3px; border-radius: 2px; background: var(--series-1); transform: translateY(50%); }
.pc-col-key { font: 500 10px var(--sans); color: var(--ink-faint); white-space: nowrap; min-height: 13px; }
.pc-col.cmp-diff .pc-col-fill { outline: 2px solid var(--err); }
.pc-col.cmp-missing .pc-col-area { outline: 2px dashed var(--warn); }
.pc-series-1 .pc-col-fill, .pc-series-1 .pc-bar-fill { background: color-mix(in srgb, var(--series-1) 45%, var(--bg-panel)); }
.pc-series-1 .pc-col.pc-lit .pc-col-fill { background: var(--series-1); }

/* fraction */
.pc-frac { display: inline-flex; align-items: center; gap: 12px; font: 800 26px var(--sans); }
.pc-frac-body { display: grid; justify-items: center; gap: 2px; }
.pc-frac-num, .pc-frac-den { display: flex; align-items: baseline; gap: 6px; }
.pc-frac-num { color: var(--accent); }
.pc-frac-line { width: 100%; min-width: 60px; height: 3px; border-radius: 2px; background: var(--ink); }
.pc-frac-lab { font: 600 11px var(--sans); color: var(--ink-faint); text-transform: uppercase; letter-spacing: .05em; }
.pc-frac-eq { color: var(--ink-faint); }
.pc-frac-res { color: var(--accent); font-size: 32px; }

/* tiles (units of a share, rows counted) */
.pc-tiles { display: flex; flex-wrap: wrap; gap: 5px; }
.pc-tile { padding: 3px 8px; border-radius: 6px; border: 2px solid var(--line-strong); font: 600 12px var(--sans); background: var(--bg-panel); }
.pc-tile-on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pc-tile-on .pc-times { color: inherit; opacity: .8; }
.pc-tile-den { border-color: var(--accent); color: var(--accent); }
.pc-tile-out { border-style: dashed; color: var(--ink-faint); opacity: .7; }
.pc-funnel { display: grid; justify-items: start; gap: 6px; }
.pc-funnel-arrow { font: 700 18px var(--sans); color: var(--ink-faint); }
.pc-sorted { display: flex; flex-wrap: wrap; gap: 4px; }
.pc-chip { padding: 2px 8px; border-radius: 6px; background: var(--bg-sunken); border: 1px solid var(--line); font: 600 12px var(--sans); font-variant-numeric: tabular-nums; }
.pc-chip-lit { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pc-assign { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: start; gap: 10px; }
.pc-assign-name { font: 700 14px var(--mono); padding: 2px 10px; border-radius: 6px; background: var(--bg-sunken); border: 1px solid var(--line-strong); }
.pc-assign-arrow { font: 700 18px var(--sans); color: var(--accent); }
.pc-assign-val { min-width: 0; }

/* dot strip */
.pc-strip { position: relative; padding: 42px 10px 26px; min-width: 240px; }
.pc-strip-axis { position: absolute; left: 10px; right: 10px; bottom: 22px; height: 1px; background: var(--line-strong); }
.pc-strip-tick { position: absolute; top: 6px; transform: translateX(-50%); font: 500 11px var(--sans); color: var(--ink-faint); white-space: nowrap; }
.pc-strip-tick-end { transform: translateX(-100%); }
.pc-strip-dots { position: relative; height: 40px; }
.pc-dot { position: absolute; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--accent-mid); border: 1.5px solid var(--accent); }
.pc-dot-lit { background: var(--err); border-color: var(--err); box-shadow: 0 0 0 4px color-mix(in srgb, var(--err) 25%, transparent); }
.pc-strip-marks { position: absolute; left: 10px; right: 10px; top: 0; bottom: 22px; pointer-events: none; }
.pc-mark { position: absolute; top: 18px; bottom: 0; width: 0; border-left: 2px solid var(--series-1); }
.pc-mark-label { position: absolute; top: -18px; left: 0; transform: translateX(-50%); padding: 0 6px; border-radius: 8px; background: var(--series-1); color: #fff; font: 700 11px var(--sans); white-space: nowrap; }
.pc-mark-median { border-left-color: var(--accent); }
.pc-mark-median .pc-mark-label { background: var(--accent); color: var(--accent-ink); }

/* multi series */
.pc-multi { display: grid; gap: 10px; }
.pc-multi-name { font: 700 12px var(--sans); color: var(--series-0); }
.pc-multi-name.pc-series-1 { color: var(--series-1); }

/* ===================== Trends steps ===================== */

.pc-trend { display: grid; gap: 4px; }
.pc-trend-name { font: 700 13px var(--sans); color: var(--series-0); }
.pc-trend.pc-series-1 .pc-trend-name { color: var(--series-1); }
.pc-trend-steps { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px; }
.pc-trend-label { font: 600 11px var(--sans); color: var(--ink-faint); margin-bottom: 2px; }
.pc-trend-arrow { font: 800 16px var(--sans); color: var(--ink-faint); }
.pc-trend .pc-col { min-width: 5px; }
.pc-trend .pc-col-key { font-size: 9px; }

/* ===================== sessions timeline ===================== */

.tl { display: grid; gap: 6px; min-width: 260px; }
.tl-axis { position: relative; height: 18px; margin-left: 92px; margin-right: 12px; border-bottom: 1px solid var(--line-strong); }
.tl-tick { position: absolute; bottom: 2px; transform: translateX(-50%); font: 500 10px var(--sans); color: var(--ink-faint); }
.tl-tick-end { transform: translateX(-100%); }
.tl-pauses { font: 600 10px var(--sans); color: var(--ink-faint); }
.tl-lane { display: grid; grid-template-columns: 86px minmax(0, 1fr); align-items: center; gap: 6px; }
.tl-user { font: 700 13px var(--sans); display: grid; }
.tl-count { font: 500 11px var(--sans); color: var(--ink-faint); }
.tl-track { position: relative; height: 46px; margin-right: 12px; border-radius: 8px; background: var(--bg-sunken); }
.tl-band { position: absolute; top: 12px; height: 22px; margin-left: -5px; border-radius: 11px; opacity: .9; }
.tl-band-label { position: absolute; top: -12px; left: 4px; font: 700 9px var(--sans); color: var(--ink-soft); }
.tl-dot { position: absolute; top: 19px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--bg-panel); border: 2px solid currentColor; }
.tl-c0 { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent); }
.tl-c1 { background: color-mix(in srgb, var(--series-1) 30%, transparent); color: var(--series-1); }
.tl-c2 { background: color-mix(in srgb, var(--warn) 30%, transparent); color: var(--warn); }
.tl-c3 { background: color-mix(in srgb, var(--ok) 30%, transparent); color: var(--ok); }
.tl-dot.tl-c0, .tl-dot.tl-c1, .tl-dot.tl-c2, .tl-dot.tl-c3 { background: var(--bg-panel); }
.tl-gap { position: absolute; bottom: -2px; transform: translateX(-50%); font: 600 10px var(--sans); color: var(--ink-faint); white-space: nowrap; }
.tl-cut { color: var(--err); font-weight: 800; }
.tl-gap-lit { padding: 0 5px; border-radius: 8px; background: var(--err); color: #fff; }
.tl-rule { font-size: 12px; color: var(--ink-faint); margin-left: 92px; }

/* ===================== profile (dictionary) ===================== */

.pf { display: grid; gap: 12px; }
.pf-lookups { display: grid; gap: 3px; }
.pf-row { display: grid; grid-template-columns: minmax(96px, max-content) auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 2px 6px; border-radius: 6px; cursor: pointer; }
.pf-tag { font: 600 13px var(--mono); }
.pf-arrow { color: var(--ink-faint); }
.pf-cats { display: flex; flex-wrap: wrap; gap: 4px; }
.pf-cat { padding: 1px 8px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font: 700 12px var(--sans); }
.pf-cat-out { background: transparent; border: 1.5px dashed var(--line-strong); color: var(--ink-faint); font-style: italic; }
.pf-out .pf-tag { color: var(--ink-faint); }
.pf-double { box-shadow: inset 3px 0 0 var(--warn); background: var(--warn-bg); }
.lk-on { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--accent-soft); }
.pc-bar-row[data-link] { cursor: pointer; }

/* ===================== chart with an axis ===================== */

.ch { display: grid; gap: 6px; max-width: 360px; }
.ch-plot { position: relative; padding-left: 34px; }
.ch-axis-label { position: absolute; left: 0; bottom: 16px; font: 700 11px var(--sans); color: var(--err); }
.ch .pc-col { min-width: 50px; }
.ch .pc-col-val { font-size: 13px; }
.ch .pc-col-key { font-size: 13px; font-weight: 700; color: var(--ink); }
.ch-cut { font-size: 12px; color: var(--err); }

/* ===================== search documents ===================== */

.dq-list { display: grid; gap: 4px; }
.dq-doc { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-panel); }
.dq-serp { grid-template-columns: minmax(0, 1fr); }
.dq-out { opacity: .45; }
.dq-tick { padding-top: 1px; }
.dq-title { font: 600 13px/1.35 var(--sans); color: var(--tk-fn); }
.dq-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--ink-faint); }
.dq-domain { color: var(--ok); }
.dq-type { font-weight: 700; }
.dq-hit { background: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--ink); border-radius: 3px; padding: 0 3px; }
.dq-text { font-size: 12px; color: var(--ink-soft); }
.dq-table .dq-cell-doc { min-width: 170px; }
.dq-table .dq-col { text-align: center; white-space: nowrap; }
.dq-table th.dq-col code { font-size: 11px; }

/* ===================== campaign links ===================== */

.ub { font: 13px/1.9 var(--mono); overflow-wrap: anywhere; padding: 6px 8px; border-radius: var(--radius); background: var(--code-bg); border: 1px solid var(--line); }
.ub-seg { border-radius: 4px; padding: 1px 1px; }
.ub-scheme, .ub-fragment { color: var(--ink-faint); }
.ub-host { color: var(--tk-fn); font-weight: 700; }
.ub-path { color: var(--ink-soft); }
.ub-sep { color: var(--ink-faint); font-weight: 700; padding: 0 1px; }
.ub-utm .ub-key { color: var(--tk-key); font-weight: 700; }
.ub-other { color: var(--ink-faint); }
.ub-val { color: var(--tk-str); }
.ub-eq { color: var(--ink-faint); }
.ub-on { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 -2px 0 var(--accent); }
.ub-param[data-link] { cursor: pointer; }
.ua-arrow { font: 700 18px var(--sans); color: var(--ink-faint); padding-left: 12px; }
.ua { display: grid; gap: 4px; max-width: 420px; }
.ua-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 4px 8px; border-radius: 6px; background: var(--bg-sunken); }
.ua-row[data-link] { cursor: pointer; }
.ua-dim { font: 600 12px var(--sans); color: var(--ink-faint); }
.ua-val { font: 700 14px var(--mono); overflow-wrap: anywhere; }
.ua-notset .ua-val { color: var(--warn); }
.up { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
.up-key { font: 700 14px var(--mono); color: var(--tk-key); padding: 2px 8px; border-radius: 6px; background: var(--bg-sunken); cursor: pointer; }
.up-dim { font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); cursor: pointer; }
.up-val { font: 700 14px var(--mono); color: var(--tk-str); overflow-wrap: anywhere; }
.up-arrow { color: var(--ink-faint); font-weight: 700; }
.up-ignored { color: var(--ink-faint); text-decoration: line-through; }
.up-none { background: transparent; border: 1.5px dashed var(--line-strong); color: var(--ink-faint); }
.rp td { font-family: var(--mono); font-size: 13px; }
.rp tr.rp-twin td { background: var(--warn-bg); }
.rp tr.rp-twin td:first-child { box-shadow: inset 3px 0 0 var(--warn); }

/* ===================== goal vs answer ===================== */

.cmp { display: grid; gap: 8px; padding: 10px; border: 1px dashed var(--line-strong); border-radius: 12px; background: var(--bg-sunken); }
.cmp-is-ok { border: 1.5px solid color-mix(in srgb, var(--ok) 50%, transparent); background: var(--ok-bg); }
.cmp-title { font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
.cmp-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cmp-pair-stack { grid-template-columns: minmax(0, 1fr); }
.cmp-side { display: grid; gap: 6px; align-content: start; min-width: 0; padding: 8px; border-radius: var(--radius); background: var(--bg-panel); }
.cmp-head { font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .06em; }
.cmp-goal { color: var(--ink-faint); }
.cmp-yours { color: var(--accent); }
.cmp-yours-ok { color: var(--ok); }
.cmp-empty { font-size: 13px; color: var(--ink-faint); }
.cmp-warn { color: var(--warn); font-weight: 600; }
.cmp-bad { color: var(--err); }
.cmp-ok { font-weight: 700; color: var(--ok); }
.cmp .pc-big { font-size: 28px; }
.cmp-rows .cmp-col { text-align: center; width: 1%; white-space: nowrap; }
/* The goal table must not push the editor below the fold: one line per row, capped height. */
.cmp-rows-wrap { max-height: 190px; overflow-y: auto; }
.cmp-rows td, .cmp-rows th { padding: 2px 8px; }
.cmp-rows .tb-text { max-width: 0; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmp-hint { font-size: 12px; color: var(--ink-faint); }
.cmp-sub { font-size: 11px; color: var(--ink-faint); }
.sr-list { display: flex; flex-wrap: wrap; gap: 5px; }
.sr-item { display: inline-flex; align-items: baseline; gap: 6px; }
.sr-key { font: 600 11px var(--sans); color: var(--ink-faint); }
.sr-val { padding: 2px 8px; border-radius: 6px; background: var(--bg-sunken); border: 1px solid var(--line); font: 600 12px var(--mono); }
.sr-val.cmp-diff { outline: 2px solid var(--err); }

@media (max-width: 640px) {
  .pc-assign { grid-template-columns: auto minmax(0, 1fr); }
  .pc-assign-val { grid-column: 1 / -1; }
  .dq-table .dq-cell-doc { min-width: 118px; }
  .dq-table th.dq-col { white-space: normal; }
  .dq-table th.dq-col code { font-size: 10px; }
  .dq-table td, .dq-table th { padding: 3px 5px; }
  .dq-table .dq-title { font-size: 12px; }
  .cmp-pair { grid-template-columns: minmax(0, 1fr); }
  .pc-trend-steps { grid-template-columns: minmax(0, 1fr); }
  .pc-trend-arrow { justify-self: center; transform: rotate(90deg); }
  .tl-axis { margin-left: 66px; }
  .tl-lane { grid-template-columns: 60px minmax(0, 1fr); }
  .tl-rule { margin-left: 0; }
  .ua-row { grid-template-columns: 1fr; gap: 0; }
  .pc-big { font-size: 28px; }
  .tb .tb-text { min-width: 140px; }
}

/* ===================== agreement of two codings (zgodność, kappa) ===================== */
.pc-agree { border-collapse: separate; border-spacing: 4px; font-size: 13px; }
.pc-agree th { font: 600 11px var(--sans); color: var(--ink-soft); text-align: center; padding: 2px 6px; }
.pc-agree td { min-width: 110px; padding: 6px 8px; border-radius: 8px; vertical-align: top; }
.pc-agree-same { background: var(--accent-soft); border: 1px solid var(--accent); }
.pc-agree-diff { background: var(--warn-bg); border: 1.5px dashed var(--warn); }
.pc-agree-n { font: 800 18px var(--mono); }
.pc-agree-keys { font: 11px var(--mono); color: var(--ink-soft); word-break: break-word; }
.pc-agree-empty { background: var(--bg-sunken); border: 1px solid var(--line); color: var(--ink-faint); }
.pc-agree-wrap { max-width: 100%; overflow-x: auto; }
.pc-agree-big td { min-width: 44px; padding: 4px 5px; }
.pc-agree-big .pc-agree-corner { max-width: 72px; font-size: 10px; word-break: break-all; }
@media (max-width: 520px) {
  .pc-agree-big { border-spacing: 2px; }
  .pc-agree-big td { min-width: 34px; padding: 3px 4px; }
}
.pc-agree-big .pc-agree-n { font-size: 15px; }
.pc-agree-big .pc-agree-keys { font-size: 10px; }

/* ===================== report for the teacher (reportbox.js) ===================== */

.rp { display: grid; gap: 10px; min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-panel); }
.rp-title { margin: 0; font-size: 16px; }
.rp-label { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.rp-input { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--code-bg); color: var(--ink); font: 14px/1.45 var(--sans); }
.rp-input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); border-color: var(--accent); }
.rp-name { max-width: 360px; }
textarea.rp-input { resize: vertical; font: 12.5px/1.5 var(--mono); white-space: pre; overflow: auto; }
.rp-out { display: grid; gap: 10px; min-width: 0; }
.rp-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.rp-btn { padding: 7px 16px; border: 1px solid var(--line-strong); border-radius: 20px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
.rp-btn:hover { border-color: var(--accent); }
.rp-status { font-size: 13px; color: var(--ink-soft); }
.rp-say, .rp-need { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-soft); }
.rp-check { border-top: 1px solid var(--line); padding-top: 10px; }
.rp-check > summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.rp-check[open] { display: grid; gap: 10px; }
.rp-verdicts { display: grid; gap: 6px; }
.rp-many { font-size: 13px; font-weight: 700; }
.rp-verdict { padding: 8px 12px; border-radius: 8px; font-size: 14px; }
.rp-ok { background: var(--ok-bg); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
.rp-bad { background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.rp-verdict-sub { font-size: 12px; color: var(--ink-soft); }
.rp-dialog { position: absolute; top: 4vh; left: 50%; transform: translateX(-50%); width: min(720px, 94vw); max-height: 92vh; overflow-y: auto; padding: 34px 14px 14px; border-radius: var(--radius); background: var(--bg); box-shadow: 0 18px 50px rgba(0, 0, 0, .35); }
.rp-close { position: absolute; top: 6px; right: 8px; }
.menu-report { margin-top: 12px; border-top: 1px solid var(--line); }
.rp-checkbox { display: grid; gap: 10px; min-width: 0; }

/* ===================== who is working (people.js) ===================== */

.who { min-height: 100vh; display: grid; place-items: start center; padding: 8vh 16px 40px; background: var(--bg); }
.who-card { width: min(460px, 100%); display: grid; gap: 12px; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-panel); box-shadow: var(--shadow); }
.who-card-wide { width: min(720px, 100%); }
.who-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink-soft); }
.who-brand .brand-name { display: inline; }
.who-title { margin: 0; font-size: 24px; letter-spacing: -.01em; }
.who-say { margin: 0; line-height: 1.5; }
.who-hint { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-soft); }
.who-form { display: flex; flex-wrap: wrap; gap: 8px; }
.who-input { flex: 1 1 200px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--code-bg); color: var(--ink); font: 16px/1.4 var(--sans); }
.who-input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); border-color: var(--accent); }
.who-back { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.who-back[hidden] { display: none; }
.who-back-label { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.who-list { display: grid; gap: 6px; max-height: 40vh; overflow-y: auto; }
.who-person { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.who-person[hidden] { display: none; }
.who-person:hover { border-color: var(--accent); }
.who-name { font-weight: 700; overflow-wrap: anywhere; }
.who-meta { flex: none; font-size: 12px; color: var(--ink-soft); }
.who-teacher, .who-link { padding: 0; border: 0; background: none; color: var(--ink-soft); font: inherit; font-size: 13px; text-decoration: underline; text-align: left; cursor: pointer; }
.who-teacher:hover, .who-link:hover { color: var(--accent); }
.who-close { justify-self: start; }
.who-line, .who-box { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 8px 6px; font-size: 13px; color: var(--ink-soft); }
.who-line-name { font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.who-danger { color: var(--err); font-weight: 700; }

/*
 * The textbook: a long reading page on the trainer's visual language (same tokens,
 * same accent). Reading text sits in a 720 px column; figures slightly wider;
 * embedded exercises break out to the full width so the stage fits beside them.
 * Kinds of work have one colour each: theory = accent, exercise = green,
 * discussion = violet, project = amber.
 */

:root { --kind-teoria: var(--accent); --kind-cwiczenie: var(--ok); --kind-dyskusja: var(--series-1); --kind-projekt: var(--warn); }

.bk { min-height: 100%; }
.bk-top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--line);
}
.bk-top-title { font: 700 14px var(--sans); color: var(--ink); white-space: nowrap; }
.bk-toc-btn {
  display: none;
  padding: 6px 12px; border: 1px solid var(--line); border-radius: 20px;
  background: var(--bg-sunken); cursor: pointer; font-weight: 600; white-space: nowrap;
}
.bk-progress { margin-left: auto; font: 600 13px var(--sans); color: var(--ok); white-space: nowrap; }

.bk-main { display: grid; grid-template-columns: 250px minmax(0, 1fr); align-items: start; }
.bk-toc {
  position: sticky; top: 49px;
  max-height: calc(100vh - 49px); overflow-y: auto;
  display: grid; gap: 2px; padding: 18px 10px 18px 14px;
  border-right: 1px solid var(--line);
}
.bk-toc-item {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: baseline; gap: 4px;
  padding: 6px 8px; border-radius: 8px;
  color: var(--ink-soft); text-decoration: none; font-size: 14px; line-height: 1.3;
}
.bk-toc-top { display: block; font-weight: 700; color: var(--ink); }
.bk-toc-item:hover { background: var(--bg-sunken); color: var(--ink); }
.bk-toc-on { background: var(--accent-soft); color: var(--ink); }
.bk-toc-num { font: 700 12px var(--mono); color: var(--accent); }
.bk-toc-done { color: var(--ok); font-weight: 800; }
.bk-toc-sub { padding-top: 3px; padding-bottom: 3px; font-size: 13px; }
.bk-toc-sub .bk-toc-num { color: var(--ink-faint); text-align: right; padding-right: 6px; }
.bk-ex[id] { scroll-margin-top: 60px; }
.bk-toc-tag { display: block; margin-top: 2px; font-size: 11px; font-weight: 700; letter-spacing: .02em; color: var(--ink-faint); }
.bk-toc-tag-before { color: var(--accent); }
.bk-toc-tag-meeting { color: var(--ink-soft); }

.bk-article { display: grid; justify-items: center; gap: 0; padding: 8px 28px 80px; min-width: 0; }
.bk-article > section { width: 100%; max-width: 1180px; display: grid; justify-items: center; }
.bk-article > section > * { width: 100%; max-width: 720px; }
.bk-article > section > .bk-fig { max-width: 820px; }
.bk-article > section > .bk-ex-wide { max-width: 1180px; }

/* ---------- hero ---------- */
.bk-hero { padding: 30px 0 10px; gap: 14px; }
.bk-kicker { font: 700 12px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.bk-title { margin: 0; font: 800 34px/1.15 var(--sans); letter-spacing: -.015em; }
.bk-lead { margin: 0; font: 400 19px/1.55 var(--sans); color: var(--ink-soft); }
.bk-authors { margin: -6px 0 0; font: 600 15px var(--sans); color: var(--ink-soft); }
.bk-box { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-panel); }
.bk-box-title { font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); margin-bottom: 8px; }
.bk-outcomes, .bk-howto { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.bk-outcomes li, .bk-howto li { display: flex; gap: 10px; align-items: baseline; }
.bk-code { font: 700 12px var(--mono); color: var(--accent); min-width: 26px; }
.bk-prep { margin: 0; font-size: 14px; color: var(--ink-soft); }

.bk-kind, .bk-meet {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font: 700 11px var(--sans); letter-spacing: .02em; white-space: nowrap;
  border: 1px solid currentColor;
}
.bk-meet { color: var(--ink-soft); border-color: var(--line-strong); }
.bk-kind-teoria { color: var(--kind-teoria); }
.bk-kind-cwiczenie { color: var(--kind-cwiczenie); }
.bk-kind-dyskusja { color: var(--kind-dyskusja); }
.bk-kind-projekt { color: var(--kind-projekt); }
.bk-howto .bk-kind { min-width: 84px; text-align: center; }

/* ---------- sections ---------- */
.bk-section { padding-top: 40px; gap: 16px; scroll-margin-top: 56px; }
.bk-sec-head { display: grid; gap: 8px; padding-top: 18px; border-top: 1px solid var(--line); }
.bk-sec-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.bk-sec-title { margin: 0; font: 800 26px/1.2 var(--sans); letter-spacing: -.01em; }
.bk-sec-num { color: var(--accent); }
.bk-p { margin: 0; font: 400 17px/1.65 var(--sans); }
.bk-p strong { color: var(--ink); }
.bk-p em { font-style: italic; }
.bk-p a, .bk-ref a, .fg-source a { color: var(--accent); }

.bk-terms { margin: 0; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--bg-panel); border-radius: 0 var(--radius) var(--radius) 0; display: grid; gap: 6px; }
.bk-term { display: grid; grid-template-columns: minmax(120px, 30%) 1fr; gap: 10px; }
.bk-term dt { font-weight: 700; }
.bk-term dd { margin: 0; color: var(--ink-soft); }

.bk-note { padding: 12px 14px; border-radius: var(--radius); font-size: 15px; line-height: 1.55; }
.bk-note-info { background: var(--accent-soft); }
.bk-note-warn { background: var(--warn-bg); border-left: 3px solid var(--warn); }

.bk-discuss { padding: 12px 16px; border: 1px dashed var(--kind-dyskusja); border-radius: var(--radius); background: color-mix(in srgb, var(--series-1) 6%, var(--bg-panel)); }
.bk-discuss-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-soft); }
.bk-discuss ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; }

.bk-read { font-size: 14px; color: var(--ink-soft); display: grid; gap: 4px; }
.bk-datasets ul, .bk-refs ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 14px; }
.bk-datasets a { font-weight: 700; color: var(--accent); }
.bk-ds-what { color: var(--ink); }
.bk-ds-lic { color: var(--ink-faint); font-size: 12px; }

/* ---------- exercise frame ---------- */
.bk-ex { display: grid; gap: 12px; padding: 16px; border: 1px solid color-mix(in srgb, var(--ok) 35%, var(--line)); border-radius: 12px; background: var(--bg-panel); box-shadow: var(--shadow); }
.bk-ex-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bk-ex-title { flex-basis: 100%; margin: 0; font: 800 19px/1.3 var(--sans); }
.bk-ex-who { font-size: 13px; color: var(--ink-soft); }

/* ---------- figure frame ---------- */
.fg { margin: 0; display: grid; gap: 10px; padding: 14px 16px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-panel); }
.fg-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.fg-num { font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); white-space: nowrap; }
.fg-title { font: 700 16px/1.3 var(--sans); }
.fg-body { display: grid; gap: 12px; min-width: 0; }
.fg-caption { padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--bg-sunken); border-radius: 0 8px 8px 0; font-size: 14px; line-height: 1.5; }
.fg-source { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-faint); }
.fg-toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.fg-toggle {
  padding: 5px 11px; border: 1px solid var(--line); border-radius: 20px;
  background: var(--bg-panel); cursor: pointer; font-size: 13px; line-height: 1.3; text-align: left;
}
.fg-toggle:hover { border-color: var(--accent); }
.fg-toggle-on, .fg-toggle-on:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ls-chip-on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* ---------- 1.1 traces ---------- */
.tr { display: grid; gap: 12px; }
.tr-day { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.tr-event {
  width: 100%; height: 100%; display: grid; gap: 2px; justify-items: start; text-align: left;
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-panel); cursor: pointer;
}
.tr-event:hover { border-color: var(--accent); }
.tr-on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.tr-time { font: 700 12px var(--mono); color: var(--accent); }
.tr-label { font-size: 13px; line-height: 1.3; }
.tr-acc { font: 700 10px var(--sans); text-transform: uppercase; letter-spacing: .06em; }
.tr-acc-full .tr-acc { color: var(--ok); }
.tr-acc-agg .tr-acc, .tr-acc-part .tr-acc { color: var(--accent); }
.tr-acc-none { border-style: dashed; opacity: .6; }
.tr-acc-none .tr-acc { color: var(--ink-faint); }
.tr-card { display: grid; gap: 8px; padding: 12px; border-radius: 8px; background: var(--code-bg); border: 1px solid var(--line); }
.tr-card-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 13px; }
.tr-kind { font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.tr-holder { color: var(--ink-soft); }
.tr-record { border-collapse: collapse; font: 13px var(--mono); width: 100%; }
.tr-record th { text-align: left; font-weight: 600; color: var(--ink-faint); padding: 3px 12px 3px 0; white-space: nowrap; vertical-align: top; width: 1%; }
.tr-record td { padding: 3px 0; word-break: break-word; }
.tr-hidden td { color: var(--ink-faint); letter-spacing: .1em; }
.tr-note { margin: 0; font-size: 14px; }

/* ---------- 1.2 quadrants ---------- */
.qd { display: grid; grid-template-columns: 104px 1fr 1fr; gap: 6px; }
.qd-corner { grid-column: 1; grid-row: 1; }
.qd-axis { font: 700 11px var(--sans); color: var(--ink-faint); text-transform: uppercase; letter-spacing: .05em; }
.qd-axis-x { text-align: center; padding: 2px 4px; }
.qd-axis-y { align-self: center; text-align: right; line-height: 1.3; }
.qd-cell {
  min-height: 64px; display: grid; align-content: start; gap: 4px; padding: 10px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg-sunken); cursor: pointer; text-align: left;
}
.qd-cell:hover { border-color: var(--accent); }
.qd-name { font: 700 14px var(--sans); }
.qd-ex { font-size: 12px; color: var(--ink-soft); }
.qd-on { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.qd-target { border-style: dashed; border-color: var(--accent); }
.qx { display: grid; gap: 12px; }
.qx-say { margin: 0; font-weight: 600; }
.qx-pool { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; }
.qx-empty { color: var(--ink-faint); font-size: 13px; align-self: center; }
.qx-in { display: flex; flex-wrap: wrap; gap: 4px; }
.qx-card {
  padding: 5px 9px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg-panel);
  cursor: pointer; font-size: 13px; line-height: 1.3; text-align: left;
}
.qx-card:hover { border-color: var(--accent); }
.qx-pick { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.qx-good { border-color: var(--ok); background: var(--ok-bg); }
.qx-bad { border-color: var(--err); background: var(--err-bg); }
.qx-mark { font-weight: 800; margin-right: 4px; }
.qx-here { justify-self: start; padding: 3px 10px; border: 1px dashed var(--accent); border-radius: 20px; background: var(--accent-soft); color: var(--accent); cursor: pointer; font: 600 12px var(--sans); }
.qx-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.qx-why { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }

/* ---------- 1.3 coverage ---------- */
.cv { display: grid; gap: 12px; }
.cv-funnel { display: grid; gap: 8px; }
.cv-row { display: grid; grid-template-columns: minmax(150px, 38%) 1fr 64px; gap: 10px; align-items: center; }
.cv-label { font-size: 13px; line-height: 1.25; }
.cv-track { position: relative; height: 18px; border-radius: 4px; background: var(--bg-sunken); }
.cv-fill { height: 100%; border-radius: 4px; transition: width .35s ease; }
.cv-fill-all { background: var(--line-strong); }
.cv-fill-inet { background: var(--accent-mid); }
.cv-fill-social { background: var(--accent); }
.cv-fill-writers { background: repeating-linear-gradient(45deg, var(--accent) 0 4px, transparent 4px 8px); border: 1px dashed var(--accent); }
.cv-eu { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.cv-val { font: 700 13px var(--mono); text-align: right; white-space: nowrap; }
.cv-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-soft); }
.cv-key { display: inline-block; width: 14px; height: 10px; margin-right: 6px; vertical-align: middle; }
.cv-key-eu { width: 2px; height: 12px; background: var(--ink); }
.cv-key-est { background: repeating-linear-gradient(45deg, var(--accent) 0 3px, transparent 3px 6px); border: 1px dashed var(--accent); }
.cv-people { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; max-width: 420px; }
.cv-dot { aspect-ratio: 1; border-radius: 50%; }
.cv-dot-social { background: var(--accent); }
.cv-dot-inet { background: var(--accent-mid); }
.cv-dot-off { border: 1.5px dashed var(--line-strong); }
.cv-sub { font: 700 14px var(--sans); margin-top: 6px; }
.cv-stack { display: grid; gap: 8px; }
.cv-stack-row { display: grid; gap: 4px; }
.cv-stack-label { font-size: 13px; color: var(--ink-soft); }
.cv-stack-bar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; }
.cv-seg {
  border: 0; border-right: 1px solid var(--bg-panel); padding: 0; cursor: pointer;
  font: 700 11px var(--sans); color: var(--ink); overflow: hidden; white-space: nowrap;
  transition: width .35s ease;
}
.cv-seg-0 { background: color-mix(in srgb, var(--accent) 12%, var(--bg-panel)); }
.cv-seg-1 { background: color-mix(in srgb, var(--accent) 22%, var(--bg-panel)); }
.cv-seg-2 { background: color-mix(in srgb, var(--accent) 32%, var(--bg-panel)); }
.cv-seg-3 { background: color-mix(in srgb, var(--accent) 42%, var(--bg-panel)); }
.cv-seg-4 { background: color-mix(in srgb, var(--accent) 52%, var(--bg-panel)); }
.cv-seg-5 { background: color-mix(in srgb, var(--accent) 62%, var(--bg-panel)); }
.cv-seg-on { background: var(--series-1); color: var(--accent-ink); }
.cv-ages .fg-toggle { font-family: var(--mono); }

/* ---------- 1.4 validity ---------- */
.va { display: grid; gap: 10px; }
.va-rule { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--code-bg); }
.va-prefix { color: var(--tk-id); font: 600 14px var(--mono); white-space: nowrap; }
.va-input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 14px var(--mono); padding: 4px 0; outline: none; }
.va-hint { font-size: 12px; color: var(--ink-faint); margin-top: -4px; }
.va-result { display: grid; gap: 10px; }
.va-matrix { display: grid; grid-template-columns: 76px 1fr 1fr; gap: 6px; }
.va-col, .va-rowh { font: 700 11px var(--sans); color: var(--ink-faint); text-transform: uppercase; letter-spacing: .04em; }
.va-col { text-align: center; }
.va-rowh { align-self: center; }
.va-cell { display: grid; align-content: start; gap: 6px; min-height: 70px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); }
.va-cell-title { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 700; }
.va-n { font: 800 15px var(--mono); }
.va-posts { display: flex; flex-wrap: wrap; gap: 4px; }
.va-tp { background: var(--accent-soft); border-color: var(--accent); }
.va-fp { background: var(--err-bg); border-color: var(--err); }
.va-fn { background: var(--warn-bg); border: 1.5px dashed var(--warn); }
.va-tn { background: var(--bg-sunken); }
.va-post { padding: 2px 7px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg-panel); cursor: pointer; font: 12px var(--mono); }
.va-post-on { background: var(--ink); color: var(--bg-panel); }
.va-text { font-size: 14px; padding: 6px 10px; border-radius: 8px; background: var(--code-bg); border: 1px solid var(--line); }
.va-text-idle { color: var(--ink-faint); }
.va-truth { margin-left: 8px; font-size: 12px; color: var(--ink-soft); }
.va-metrics { display: grid; gap: 6px; }
.va-metrics .cv-row { grid-template-columns: 90px 1fr 54px; }

/* ---------- 1.5 routes ---------- */
.rt { display: grid; gap: 10px; }
.rt-ask { font: 700 13px var(--sans); color: var(--ink-soft); }
.rt-questions { display: grid; grid-template-columns: 1fr; }
.rt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.rt-card { display: grid; gap: 4px; align-content: start; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-panel); transition: opacity .25s; }
.rt-name { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 700 14px var(--sans); }
.rt-badge { font: 700 10px var(--sans); text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 10px; }
.rt-text { font-size: 13px; line-height: 1.45; }
.rt-who { font-size: 11px; color: var(--ink-faint); }
.rt-tak { border-color: var(--ok); background: var(--ok-bg); }
.rt-tak .rt-badge { background: var(--ok); color: var(--bg-panel); }
.rt-moze { border-color: var(--warn); border-style: dashed; }
.rt-moze .rt-badge { background: var(--warn-bg); color: var(--warn); }
.rt-off { opacity: .45; }
.dm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.dm-card { display: grid; gap: 6px; align-content: start; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-panel); transition: opacity .25s; }
.dm-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; justify-content: space-between; }
.dm-name { font: 700 14px var(--sans); }
.dm-chapter { font: 700 10px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.dm-record { display: flex; flex-wrap: wrap; gap: 4px; }
.dm-field { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font: 11px var(--mono); }
.dm-key { padding: 1px 5px; background: var(--bg-sunken); color: var(--ink-soft); }
.dm-val { padding: 1px 5px; }
.dm-text { font-size: 13px; line-height: 1.45; }
.dm-not { font-size: 12px; line-height: 1.4; color: var(--ink-soft); }
.dm-tools { font-size: 12px; color: var(--ink-soft); }
.dm-tools-label { font: 700 10px var(--sans); text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; color: var(--ink-faint); }
.dm-on { border-color: var(--ok); background: var(--ok-bg); }
.dm-off { opacity: .45; }

/* ---------- 1.6 traits ---------- */
.tt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.tt-card { display: grid; gap: 1px; justify-items: start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-panel); cursor: pointer; text-align: left; }
.tt-card:hover { border-color: var(--accent); }
.tt-good { border-left: 4px solid var(--ok); }
.tt-bad { border-left: 4px solid var(--err); }
.tt-on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.tt-num { font: 700 11px var(--mono); color: var(--ink-faint); }
.tt-name { font: 700 14px/1.25 var(--sans); hyphens: auto; overflow-wrap: anywhere; }
.tt-en { font-size: 11px; color: var(--ink-faint); font-style: italic; }
.tx { display: grid; gap: 12px; }
.tx-rows { display: grid; gap: 4px; }
.tx-row { display: grid; grid-template-columns: minmax(150px, 30%) 1fr; gap: 4px 10px; align-items: center; padding: 6px 8px; border-radius: 8px; }
.tx-row:nth-child(odd) { background: var(--bg-sunken); }
.tx-name { font-weight: 700; font-size: 14px; }
.tx-rate .fg-toggle { padding: 3px 9px; font-size: 12px; }
.tx-ours { grid-column: 1 / -1; font-size: 13px; color: var(--ink-soft); }
.tx-same .tx-name::after { content: " ✓"; color: var(--ok); }
.tx-diff .tx-name::after { content: " ≠"; color: var(--warn); }
.tx-count { font-size: 13px; color: var(--ink-soft); }
.ls-check:disabled { opacity: .45; cursor: default; }

/* ---------- 1.7 ethics ---------- */
.et { display: grid; gap: 10px; }
.et-list { margin: 0; padding-left: 22px; display: grid; gap: 12px; }
.et-item { padding: 4px 0; }
.et-text { margin: 0 0 6px; }
.et-why { margin: 6px 0 0; font-size: 14px; padding: 6px 10px; border-radius: 8px; }
.et-right .et-why { background: var(--ok-bg); }
.et-wrong .et-why { background: var(--warn-bg); }

/* ---------- project card, summary ---------- */
.kc { display: grid; gap: 12px; }
.kc-fields { display: grid; gap: 10px; }
.kc-field { display: grid; gap: 4px; }
.kc-label { font: 700 13px var(--sans); }
.kc-input { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--code-bg); color: var(--ink); font: 14px/1.45 var(--sans); }
textarea.kc-input { resize: vertical; }
.kc-input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); border-color: var(--accent); }
.kc-multi { display: flex; flex-wrap: wrap; gap: 6px; }
.kc-status { font-size: 13px; color: var(--ink-soft); }
.kc-ok { color: var(--ok); font-weight: 700; }
.sm { display: grid; gap: 10px; }
.sm-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.sm-list li { display: flex; gap: 10px; align-items: baseline; }
.sm-list a { color: var(--ink); }
.sm-mark { width: 16px; color: var(--ink-faint); font-weight: 800; }
.sm-done .sm-mark { color: var(--ok); }

/* ---------- plan ---------- */
.cm { display: grid; gap: 10px; }
.cm-row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.cm-meet {
  height: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-sunken); cursor: pointer;
  font: 700 12px var(--mono); color: var(--ink-soft);
}
.cm-t1 { border-bottom: 4px solid var(--accent); }
.cm-t2 { border-bottom: 4px solid var(--series-1); }
.cm-t3 { border-bottom: 4px solid var(--ok); }
.cm-t4 { border-bottom: 4px solid var(--warn); }
.cm-t5 { border-bottom: 4px solid var(--tk-fn); }
.cm-t0 { border-bottom: 4px solid var(--ink-faint); }
.cm-on { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.cm-here { font-weight: 800; }
.pl { display: grid; gap: 12px; }
.pl-meet { display: grid; gap: 6px; }
.pl-head { display: flex; justify-content: space-between; font-size: 13px; }
.pl-bar { display: flex; gap: 3px; }
.pl-seg {
  display: grid; gap: 0; place-items: center; min-width: 0; height: 44px; padding: 2px; border-radius: 6px;
  color: var(--accent-ink); text-decoration: none; overflow: hidden;
}
.pl-seg:hover { filter: brightness(1.1); }
.pl-num { font: 700 12px var(--mono); }
.pl-min { font: 600 11px var(--sans); opacity: .9; }
.pl-teoria { background: var(--kind-teoria); }
.pl-cwiczenie { background: var(--kind-cwiczenie); }
.pl-dyskusja { background: var(--kind-dyskusja); }
.pl-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-soft); }
.pl-key { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* ---------- workbench: a trainer lesson inside the book ---------- */
.wb { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.wb-lesson .ls { padding: 0; }
.wb-lesson .ls-top { display: none; }
.wb-lesson .ls-say { font-size: 17px; }
.wb-side { position: sticky; top: 60px; }
.wb-stage { padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
.wb-stage .stage-body { min-height: 200px; }
.wb-data { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.wb-data-label { font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }

@media (max-width: 1100px) {
  .wb { grid-template-columns: minmax(0, 1fr); }
  .wb-side { position: static; }
  .wb-side:empty { display: none; }
}

@media (max-width: 980px) {
  .bk-main { grid-template-columns: minmax(0, 1fr); }
  .bk-toc-btn { display: inline-block; }
  .bk-toc {
    display: none; position: fixed; top: 49px; left: 0; right: 0; z-index: 19;
    max-height: 70vh; border-right: 0; border-bottom: 1px solid var(--line);
    background: var(--bg-panel); box-shadow: var(--shadow);
  }
  .bk-toc-open .bk-toc { display: grid; }
  .bk-article { padding: 4px 16px 60px; }
}

@media (max-width: 560px) {
  .brand-name { display: none; }
  .bk-title { font-size: 26px; }
  .bk-lead { font-size: 17px; }
  .bk-sec-title { font-size: 22px; }
  .bk-p { font-size: 16px; }
  .bk-ex, .fg { padding: 12px; }
  .bk-term { grid-template-columns: 1fr; gap: 0; }
  .cv-row { grid-template-columns: 1fr 56px; }
  .cv-row .cv-label { grid-column: 1 / -1; }
  .qd { grid-template-columns: 1fr 1fr; }
  .qd-corner { display: none; }
  .qd-axis-y { grid-column: 1 / -1; text-align: left; padding-top: 4px; }
  .qd-cell { min-height: 64px; padding: 8px; }
  .qd-name { font-size: 12px; }
  .va-matrix { grid-template-columns: 58px 1fr 1fr; }
  .tx-row { grid-template-columns: 1fr; }
  .cm-row { grid-template-columns: repeat(6, 1fr); }
  .pl-min { display: none; }
}

/* figure: access timeline -- closing events above the year axis, opening ones below */
.at-legend { display: flex; gap: 12px; font-size: 12px; }
.at-leg::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.at-leg.at-zamyka::before { background: var(--err); }
.at-leg.at-otwiera::before { background: var(--ok); }
.at-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: auto auto auto; gap: 6px 4px; }
.at-cell { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.at-cell-zamyka { justify-content: flex-end; }
.at-list { display: none; }
.at-axis { border-top: 2px solid var(--line-strong); padding-top: 3px; font: 600 11px var(--mono); color: var(--ink-soft); text-align: center; }
.at-chip { display: grid; gap: 1px; justify-items: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 2px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-panel); font: 600 12px var(--sans); color: var(--ink); cursor: pointer; }
.at-chip .at-year { display: none; font: 600 10px var(--mono); color: var(--ink-faint); }
.at-chip.at-zamyka { border-color: var(--err); background: var(--err-bg); }
.at-chip.at-otwiera { border-color: var(--ok); background: var(--ok-bg); }
.at-chip.at-picked { outline: 2px solid var(--accent); outline-offset: 1px; }
.at-card { display: grid; gap: 6px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); border-left: 4px solid var(--line-strong); background: var(--bg-panel); }
.at-card-zamyka { border-left-color: var(--err); }
.at-card-otwiera { border-left-color: var(--ok); }
.at-when { font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
.at-title { font: 700 15px var(--sans); }
.at-text { font-size: 14px; line-height: 1.5; }
.at-means { font-size: 13px; line-height: 1.45; color: var(--ink-soft); }
.at-route { font-size: 12px; color: var(--ink-faint); }
.at-source { font-size: 12px; justify-self: start; }
@media (max-width: 600px) {
  /* on a phone the axis becomes a list in date order */
  .at-grid { display: none; }
  .at-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .at-chip { grid-auto-flow: column; gap: 5px; padding: 4px 8px; }
  .at-chip .at-year { display: inline; }
}

/* figure: Google Flu Trends vs CDC */
.flu-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; }
.flu-leg::before { content: ""; display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: 3px; border-radius: 2px; }
.flu-leg-gft::before { background: var(--err); }
.flu-leg-cdc::before { background: var(--accent); }
.flu-wrap { width: 100%; }
.flu-svg { width: 100%; height: auto; display: block; }
.flu-grid { stroke: var(--line); stroke-width: 1; }
.flu-tick, .flu-season { font: 10px var(--mono); fill: var(--ink-faint); }
.flu-season-on { fill: var(--ink); font-weight: 700; }
.flu-dim { fill: var(--bg-panel); opacity: .65; }
.flu-gft { fill: none; stroke: var(--err); stroke-width: 2; }
.flu-cdc { fill: none; stroke: var(--accent); stroke-width: 2; }
.flu-gap { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 3; }
.flu-dot-gft { fill: var(--err); }
.flu-dot-cdc { fill: var(--accent); }
.flu-read { padding: 8px 10px; border-radius: 8px; background: var(--bg-sunken); font-size: 14px; line-height: 1.45; }
.flu-read-bad { background: var(--err-bg); }
@media (max-width: 600px) {
  /* the chart shrinks to about half its size, so its labels need twice the font */
  .flu-tick, .flu-season { font-size: 20px; }
  .flu-gft, .flu-cdc { stroke-width: 3; }
}

/* figure: where errors enter (Sen et al. 2021, simplified) */
.er-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.er-arrow { color: var(--ink-faint); font-weight: 700; }
.er-step { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--bg-panel); color: var(--ink); font: 600 13px var(--sans); cursor: pointer; }
.er-n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--bg-sunken); font: 700 11px var(--mono); }
.er-step.er-kto { border-color: var(--accent); }
.er-step.er-co { border-color: var(--warn); }
.er-step.er-on { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: 1px; }
.er-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-soft); }
.er-leg::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -2px; border: 2px solid var(--line-strong); }
.er-leg.er-kto::before { border-color: var(--accent); }
.er-leg.er-co::before { border-color: var(--warn); }
.er-card { display: grid; gap: 6px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-panel); }
.er-ask { font: 700 15px var(--sans); }
.er-error { font-size: 14px; line-height: 1.5; }
.er-example { font-size: 13px; line-height: 1.45; color: var(--ink-soft); }
.er-where { font-size: 12px; color: var(--ink-faint); }

/* figure: participation and consent sieves */
.pa-dots { display: flex; flex-wrap: wrap; gap: 4px; max-width: 360px; }
.pa-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); background: transparent; }
.pa-dot.pa-czasem { border-color: var(--accent); background: var(--accent-mid); }
.pa-dot.pa-duzo { border-color: var(--err); background: var(--err); }
.pa-dot.pa-widzi { border-color: var(--accent); background: var(--accent); }
.pa-dot.pa-nie { border-style: dashed; }
.pa-rows { display: grid; gap: 4px; max-width: 420px; }
